AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Automatic Event Hold Release for Amazon S3 Object Lock — Automatically releases the
  S3 Object Lock event hold on noncurrent object versions so their post-event retention
  countdown begins and a NoncurrentVersionExpiration lifecycle rule can eventually
  delete them. Operates as a
  periodic batch pipeline (S3 Inventory → Athena → S3 Batch Operations) deployed in the
  same Region as the target bucket. Report-only by default; supports active release with
  configurable safety controls.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Target Configuration
        Parameters:
          - TargetBucket
          - Prefix
      - Label:
          default: Release Configuration
        Parameters:
          - ReleaseMode
          - DetectionSchedule
      - Label:
          default: Safety Controls
        Parameters:
          - ReportOnly
          - SafetyThreshold
      - Label:
          default: Security (optional)
        Parameters:
          - KMSKeyArn
      - Label:
          default: SolutionBucket Access Logging (optional)
        Parameters:
          - EnableServerAccessLogs
          - ServerAccessLogsDestinationLogGroupArn
          - ServerAccessLogsRetentionDays
          - EnableS3TablesIntegration
    ParameterLabels:
      TargetBucket:
        default: Target Bucket Name
      Prefix:
        default: Object Key Prefix (optional)
      ReleaseMode:
        default: Release Mode
      DetectionSchedule:
        default: Detection Schedule
      ReportOnly:
        default: Report Only Mode
      SafetyThreshold:
        default: Safety Threshold
      KMSKeyArn:
        default: KMS Key ARN (optional)
      EnableServerAccessLogs:
        default: Enable Server Access Logs
      ServerAccessLogsDestinationLogGroupArn:
        default: Server Access Logs Destination Log Group ARN (optional)
      ServerAccessLogsRetentionDays:
        default: Server Access Logs Retention (days)
      EnableS3TablesIntegration:
        default: Enable S3 Tables Integration for Access Logs

Parameters:
  TargetBucket:
    Type: String
    Description: >
      Name of the S3 bucket (with Object Lock and Versioning enabled) whose noncurrent
      object versions this solution evaluates for event-hold release.
    AllowedPattern: '^[a-z0-9][a-z0-9\-]{1,61}[a-z0-9]$'
    ConstraintDescription: >
      Must be a valid S3 bucket name: 3–63 characters, lowercase letters, numbers, and
      hyphens only, starting and ending with a letter or number.

  Prefix:
    Type: String
    Default: ''
    Description: >
      Optional S3 object key prefix. When set, only versions whose keys begin with this
      prefix are evaluated. Leave blank to evaluate the entire bucket.

  ReleaseMode:
    Type: String
    AllowedValues:
      - delete
      - overwrite
      - either
    Description: >
      Controls which class of superseded noncurrent versions is eligible for event-hold
      release. "delete" acts only on versions whose immediate superseding version is a
      delete marker; "overwrite" acts only on versions whose immediate superseding
      version is a data version; "either" acts on both classes.
    ConstraintDescription: Must be one of delete, overwrite, or either.

  DetectionSchedule:
    Type: String
    AllowedValues:
      - DAILY
      - WEEKLY
    Default: WEEKLY
    Description: >
      S3 Inventory generation cadence. DAILY delivers inventory once per day; WEEKLY
      delivers it once per week. This governs how frequently the solution evaluates the
      target bucket.
    ConstraintDescription: Must be DAILY or WEEKLY.

  ReportOnly:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: >
      When "true", the solution identifies eligible versions and produces eligibility
      manifests but does not release any holds (Batch Operations jobs are created
      suspended for inspection). When "false", the solution actively releases holds
      each run.
    ConstraintDescription: Must be true or false.

  SafetyThreshold:
    Type: Number
    Default: 1000
    MinValue: 0
    Description: >
      Maximum number of event-hold releases an active run may submit to S3 Batch
      Operations. If a mode's verified eligible count exceeds this value, no Batch
      Operations job is created; SNS and the durable run summary record the withheld
      mode for review. Has no effect when ReportOnly is true.

  KMSKeyArn:
    Type: String
    Default: ''
    Description: >
      Optional ARN of a customer managed KMS key. When provided, the key encrypts
      the SolutionBucket (SSE-KMS), the SNS notification topic, the pipeline
      dead-letter queue, and every Lambda function's CloudWatch Logs log group.
      When blank, the SolutionBucket uses SSE-S3, SNS uses its default AWS-owned
      key, and log groups are unencrypted. Enable automatic key rotation
      (EnableKeyRotation) on any customer managed key used here -- AWS managed keys
      rotate automatically, but customer managed keys do not unless this is turned
      on explicitly. The key policy must grant the five Lambda execution roles and
      the S3 Batch Operations service role kms:GenerateDataKey*/kms:Decrypt, plus
      additional principals for the CloudWatch Logs, S3, and CloudWatch Alarms
      service -- see PERMISSIONS.md for the full key policy statement and the
      rationale behind each grant.
    AllowedPattern: '^(arn:(aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+)?$'
    ConstraintDescription: >
      Must be a valid KMS key ARN (arn:partition:kms:region:account-id:key/key-id)
      or blank.

  EnableServerAccessLogs:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: >
      When "true", S3 server access logs for the SolutionBucket are delivered to
      CloudWatch Logs using CloudWatch Logs vended log delivery
      (AWS::Logs::DeliverySource / DeliveryDestination / Delivery). This requires no
      destination-bucket setup: a CloudWatch Logs log group is created automatically
      (or an existing one can be supplied via ServerAccessLogsDestinationLogGroupArn).
      When "false" (default), server access logging is disabled entirely: no log
      group, no delivery, no CloudWatch Logs ingestion or storage charges, and the
      S3 Tables integration below is inert regardless of its own setting. The
      SolutionBucket holds only this solution's working artifacts, so access logging
      on it is an operational aid rather than a protection for customer data --
      opt in when you want it.
    ConstraintDescription: Must be true or false.

  ServerAccessLogsDestinationLogGroupArn:
    Type: String
    Default: ''
    Description: >
      Optional ARN of an existing CloudWatch Logs log group to receive the
      SolutionBucket's server access logs. Leave blank (default) to have the stack
      create a dedicated log group automatically. Only used when
      EnableServerAccessLogs is "true". The log group (existing or created) must be in
      the same Region as this stack.
    AllowedPattern: '^(arn:(aws|aws-us-gov|aws-cn):logs:[a-z0-9-]+:[0-9]{12}:log-group:[^:]+(:\*)?)?$'
    ConstraintDescription: >
      Must be a valid CloudWatch Logs log group ARN or blank.

  ServerAccessLogsRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
    Description: >
      Retention period, in days, for the log group created when
      ServerAccessLogsDestinationLogGroupArn is blank. Ignored when an existing log
      group ARN is supplied (that log group's own retention setting applies) or when
      EnableServerAccessLogs is "false". Defaults to 30 days.

  EnableS3TablesIntegration:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: >
      When "true" (default) AND EnableServerAccessLogs is "true" -- which is NOT the
      default, so this setting does nothing until access logging is turned on -- the
      SolutionBucket's server access logs are also mirrored to the account-and-Region-wide
      "aws-cloudwatch" S3 Tables managed table bucket in Apache Iceberg format, so they
      can be queried with standard SQL via Athena, Redshift, or other Iceberg-compatible
      engines. Both the S3 Tables integration resource and the "amazon_s3 /
      server_access" data source association it enables are single,
      account-and-Region-wide settings shared by ALL S3 server access log deliveries in
      the account and Region, not scoped to this stack. This stack creates the
      integration only if none already exists, and never disassociates the data source
      or deletes the integration on stack deletion, since doing so could stop S3 Tables
      mirroring for other buckets or stacks that rely on the same setting.

# ── Parameter validation rules ─────────────────────────────────────────────────────────
# CloudFormation Rules perform cross-parameter validation that AllowedValues alone
# cannot express. Update-time rejection of TargetBucket changes is handled separately
# in Task 3 (PrereqCheck custom resource), because CloudFormation Rules cannot compare
# parameter values between stack updates.
Rules:
  ActiveModeRequiresPositiveSafetyThreshold:
    # When ReportOnly is false (active release mode), SafetyThreshold = 0 would suspend
    # every single run regardless of eligible-version count, making active mode behave
    # identically to report-only mode. Reject this combination at deploy/update time.
    RuleCondition:
      Fn::Equals:
        - !Ref ReportOnly
        - 'false'
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - !Ref SafetyThreshold
                - '0'
        AssertDescription: >-
          When ReportOnly is false (active release mode), SafetyThreshold must be
          greater than 0. A threshold of 0 would cause every run to be suspended for
          manual confirmation regardless of eligible-version count, effectively
          disabling automatic release. Set SafetyThreshold to a positive integer or
          keep ReportOnly as true.

Conditions:
  HasKMSKey: !Not [!Equals [!Ref KMSKeyArn, '']]
  ServerAccessLogsEnabled: !Equals [!Ref EnableServerAccessLogs, 'true']
  HasExistingLogGroupArn: !Not [!Equals [!Ref ServerAccessLogsDestinationLogGroupArn, '']]
  CreateServerAccessLogGroup: !And
    - !Condition ServerAccessLogsEnabled
    - !Not [!Condition HasExistingLogGroupArn]
  S3TablesIntegrationEnabled: !And
    - !Condition ServerAccessLogsEnabled
    - !Equals [!Ref EnableS3TablesIntegration, 'true']

Resources:

  # ── Naming helper ────────────────────────────────────────────────────────────────────
  # The LowerCase custom resource converts the stack name to lowercase and returns two
  # attributes:
  #   Lower        — full lowercase stack name, used as a prefix for the Glue database
  #                  name (e.g. my-stack-db). Glue requires lowercase database names.
  #   BucketPrefix — lowercase stack name truncated to 32 characters, used as the
  #                  BucketNamePrefix for SolutionBucket. The account-regional suffix
  #                  (-<AccountId>-<Region>-an) occupies up to 31 characters, so the
  #                  prefix must be ≤ 32 characters to keep the full bucket name within
  #                  S3's 63-character limit.
  # Each deployment's resource names are unique within the account and Region, allowing
  # multiple instances to coexist (Req 1.5).

  LowerCaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lowercase-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-lowercase:*

  LowerCaseFunction:
    Type: AWS::Lambda::Function
    # DependsOn its log group, matching the four pipeline functions. Invoked before
    # the declared group exists, the runtime auto-creates an unmanaged one on the
    # account default (Never Expire, no CMK) and the declared resource collides
    # with it. Added to the four custom-resource functions that lacked it.
    DependsOn: LowerCaseLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-lowercase'
      Description: >-
        CloudFormation custom resource helper. Returns the stack name converted to
        lowercase so downstream resources can derive unique, lowercase-safe names.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt LowerCaseRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import urllib.request

          def handler(event, context):
              try:
                  req_type = event['RequestType']
                  props = event.get('ResourceProperties', {})
                  stack_name = props.get('StackName', '')
                  physical_id = event.get('PhysicalResourceId', 'lowercase-helper')

                  if req_type == 'Delete':
                      _send(event, context, 'SUCCESS', {}, physical_id)
                      return

                  lower = stack_name.lower()
                  bucket_prefix = lower[:32]
                  _send(event, context, 'SUCCESS',
                        {'Lower': lower, 'BucketPrefix': bucket_prefix},
                        lower or physical_id)
              except Exception as exc:
                  _send(event, context, 'FAILED', {},
                        event.get('PhysicalResourceId', 'error'), str(exc))

          def _send(event, context, status, data, physical_id, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or
                             'See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # Bounded: a ResponseURL that blackholes would otherwise hold the
              # invocation open for the function's whole timeout.
              urllib.request.urlopen(req, timeout=10)

  LowerCase:
    Type: Custom::LowerCase
    Properties:
      ServiceToken: !GetAtt LowerCaseFunction.Arn
      StackName: !Sub '${AWS::StackName}'

  # ── Solution bucket ──────────────────────────────────────────────────────────────────
  # Dedicated S3 bucket owned by this stack, used to receive S3 Inventory deliveries,
  # hold Athena/UNLOAD output (TEXTFILE parts), combined manifests, and S3 Batch
  # Operations completion reports. Kept separate from the Target_Bucket's protected
  # data (Req 7.2). The stack does NOT modify Target_Bucket's own inventory or lifecycle
  # configurations (Req 11.3).
  #
  # BucketNamePrefix + BucketNamespace=account-regional creates the bucket in the
  # account-regional namespace. The full name is:
  #   <BucketPrefix>-<AccountId>-<Region>-an
  # where BucketPrefix is the lowercased stack name truncated to 32 characters.
  # This name is unique to this account, predictable, and cannot be re-created by
  # another account after stack deletion.

  SolutionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketNamePrefix: !GetAtt LowerCase.BucketPrefix
      BucketNamespace: account-regional
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasKMSKey, 'aws:kms', 'AES256']
              KMSMasterKeyID: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']
            BucketKeyEnabled: !If [HasKMSKey, true, !Ref 'AWS::NoValue']
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInventorySnapshots
            Status: Enabled
            Prefix: inventory/
            ExpirationInDays: 14
          - Id: ExpireManifestParts
            Status: Enabled
            Prefix: manifests/parts/
            ExpirationInDays: 14
          - Id: ExpireCombinedManifests
            # 90 days, matching ExpireCompletionReports rather than the 14-day
            # working-artifact prefixes. This prefix is not just the combined
            # eligibility manifest (which versions were submitted) -- it also holds
            # the run's decision records: _job_summary.json and the full
            # _job_summaries/<decision-id>.json history, which preserves every
            # decision including a SafetyThreshold withholding later approved.
            # At 14 days those expired while the completion report under reports/
            # survived to 90, leaving a window where a run's outcome was provable
            # but its inputs and decisions were not. See OPERATIONS.md
            # "Audit trail". The artifacts are small (a Bucket,Key,VersionId CSV
            # plus kilobyte JSON records), so the added storage is negligible.
            Status: Enabled
            Prefix: manifests/combined/
            ExpirationInDays: 90
          - Id: ExpireAthenaResults
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 14
          - Id: ExpireCompletionReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
          - Id: ExpireWithheldCandidatesDiagnostics
            # Same 90-day window as completion reports (ExpireCompletionReports)
            # and combined manifests (ExpireCombinedManifests): all three are
            # audit/diagnostic data meant to be reviewed over time, not transient
            # per-run working artifacts like the 14-day prefixes above.
            Status: Enabled
            Prefix: diagnostics/withheld-candidates/
            ExpirationInDays: 90
          # No expiry rule on manifests/previous/ -- it holds at most one small
          # CSV per ObjectLockMode (COMPLIANCE, GOVERNANCE), overwritten by CreateJob
          # after every qualifying (non-suspended) job. It is a live dedup pointer,
          # not an accumulating artifact.
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  SolutionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # Retained because the bucket is. SolutionBucket survives stack deletion so
    # its audit trail stays readable, and this policy is a separate resource: as
    # an ordinary resource it was deleted with the stack, taking the reports/*
    # immutability Deny, the prefix write Denies, the TLS-only Deny and both
    # KMS-key-pinning Denies with it, exactly when the bucket became unattended.
    # UpdateReplacePolicy covers the same gap on a bucket-replacing update.
    #
    # Worth knowing on manual teardown: the policy outlives the stack, so the
    # KMS-key-pinning Denies keep enforcing. Empty the bucket before deleting the
    # key, or you lock yourself out of your own audit records.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SolutionBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3InventoryDelivery
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/inventory/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::${TargetBucket}'
          - Sid: DenyUnauthorizedPutObject
            # Principal: '*' + Effect: Deny is intentional here, not a broad
            # blanket rule: the Condition below narrows it to exactly the
            # principals that must NOT write to these prefixes, by excluding
            # the three solution Lambda roles and the S3 service principal
            # (which delivers inventory on behalf of TargetBucket). Every
            # other principal, in this account or any other, is denied.
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/inventory/*'
              # manifests/* covers manifests/previous/{mode}/ (the dedup pointer
              # CreateJob writes after a non-suspended job) as well as the existing
              # manifests/parts/ and manifests/combined/ prefixes.
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/athena-results/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/diagnostics/withheld-candidates/*'
            Condition:
              # Deny fires when BOTH conditions are true (AND): the caller is NOT
              # one of the solution Lambda roles AND is NOT the S3 service principal
              # (which delivers inventory on behalf of the TargetBucket).
              ArnNotLike:
                'aws:PrincipalArn':
                  - !GetAtt StartQueryRole.Arn
                  - !GetAtt ManifestMakerRole.Arn
                  - !GetAtt CreateJobRole.Arn
                  # Writes _active_jobs.json (read-modify-write, marking each
                  # job's completion) and, once every active job a run created
                  # is terminal, the same _job_summary.json/_job_summaries/*
                  # destination CreateJobRole already writes to for the
                  # non-deferred case -- see JobCompletionFunction.
                  - !GetAtt JobCompletionRole.Arn
              StringNotEqualsIfExists:
                'aws:PrincipalServiceName': 's3.amazonaws.com'
          - Sid: DenyUnauthorizedReportsPut
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/reports/*'
            Condition:
              # completion reports under reports/ are the durable per-action audit
              # trail (Req 7.2); only BatchOperationsRole writes them (S3 Batch
              # Operations' own report writer, assumed via batchoperations.s3.amazonaws.com
              # -- see BatchOperationsRole), so no other principal can overwrite a
              # report after it's been written. Deletes are intentionally not
              # restricted here: manual bucket cleanup before stack deletion (see
              # README "Manual SolutionBucket cleanup") relies on being able to
              # delete objects under reports/, and lifecycle expiration (90 days,
              # see ExpireCompletionReports) already governs deletion timing during
              # normal operation.
              ArnNotLike:
                'aws:PrincipalArn': !GetAtt BatchOperationsRole.Arn
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - !If
            # Enforces SSE-KMS with this stack's specific key at the bucket-policy
            # layer, in addition to (not instead of) BucketEncryption's default
            # encryption above. Default encryption alone only governs what happens
            # when a PutObject omits its own encryption header -- it does not stop
            # a caller who explicitly names a *different* algorithm or KMS key.
            # This statement only denies that explicit-mismatch case; it does NOT
            # deny requests that omit the encryption header entirely (the Null
            # condition below only matches when the header IS present), so every
            # existing write in this pipeline -- none of which sets the header
            # explicitly -- is unaffected and continues to pick up the bucket's
            # default encryption exactly as before. Only relevant when a customer
            # managed key is supplied; SSE-S3's default has no equivalent
            # customer-controlled key to pin.
            - HasKMSKey
            - Sid: DenyMismatchedEncryption
              Effect: Deny
              Principal: '*'
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/*'
              Condition:
                'Null':
                  's3:x-amz-server-side-encryption': false
                StringNotEquals:
                  's3:x-amz-server-side-encryption': 'aws:kms'
            - !Ref 'AWS::NoValue'
          - !If
            # NOTE: uses StringEquals on the header (not StringNotEquals, which a
            # commonly-copied blog example uses and which is a logic bug there --
            # combined via AND, StringNotEquals(header, 'aws:kms') is false
            # whenever the header genuinely IS 'aws:kms', so that version can
            # never deny a wrong-key upload at all). StringEquals here correctly
            # scopes this statement to "an aws:kms upload was made" so
            # StringNotEqualsIfExists can then check whether it used the wrong
            # key (or the implicit AWS-managed aws/s3 key, since an absent
            # key-id header makes the *IfExists condition evaluate true too).
            - HasKMSKey
            - Sid: DenyMismatchedKmsKey
              Effect: Deny
              Principal: '*'
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/*'
              Condition:
                StringEquals:
                  's3:x-amz-server-side-encryption': 'aws:kms'
                StringNotEqualsIfExists:
                  's3:x-amz-server-side-encryption-aws-kms-key-id': !Ref KMSKeyArn
            - !Ref 'AWS::NoValue'

  # ── SolutionBucket server access logs → CloudWatch Logs ─────────────────────────────
  # S3 server access logs for the SolutionBucket are delivered to CloudWatch Logs via
  # CloudWatch Logs vended log delivery (AWS::Logs::DeliverySource / DeliveryDestination
  # / Delivery), rather than to a destination S3 bucket. This requires no customer
  # setup of a destination bucket or bucket policy, supports native KMS encryption on
  # the log group (the bucket-destination path only supports SSE-S3), and is queryable
  # with CloudWatch Logs Insights. Off by default; set EnableServerAccessLogs=true
  # to opt in.
  #
  # When ServerAccessLogsDestinationLogGroupArn is blank (default), a dedicated log
  # group is created with ServerAccessLogsRetentionDays retention (default 30). When an
  # existing log group ARN is supplied instead, that log group's own retention setting
  # applies and no log group is created by this stack.

  ServerAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateServerAccessLogGroup
    Properties:
      LogGroupName: !Sub '/aws/s3/${AWS::StackName}-solutionbucket-access-logs'
      RetentionInDays: !Ref ServerAccessLogsRetentionDays
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  ServerAccessLogsDeliverySource:
    Type: AWS::Logs::DeliverySource
    Condition: ServerAccessLogsEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-sal-source'
      ResourceArn: !GetAtt SolutionBucket.Arn
      LogType: S3_SERVER_ACCESS_LOGS

  ServerAccessLogsDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Condition: ServerAccessLogsEnabled
    Metadata:
      cfn-lint:
        config:
          # The blank parameter branch is unreachable when the existing ARN is used;
          # the alternate !If branch supplies the stack-created log group ARN.
          ignore_checks:
            - W1030
    Properties:
      Name: !Sub '${AWS::StackName}-sal-destination'
      DestinationResourceArn: !If
        - CreateServerAccessLogGroup
        - !GetAtt ServerAccessLogGroup.Arn
        - !Ref ServerAccessLogsDestinationLogGroupArn

  ServerAccessLogsDelivery:
    Type: AWS::Logs::Delivery
    Condition: ServerAccessLogsEnabled
    Properties:
      DeliverySourceName: !Ref ServerAccessLogsDeliverySource
      DeliveryDestinationArn: !GetAtt ServerAccessLogsDeliveryDestination.Arn

  # ── S3 Tables integration for access logs (optional; on, but gated) ─────────────────
  # EnableS3TablesIntegration defaults to "true" while EnableServerAccessLogs defaults
  # to "false", so nothing here is created unless access logging is opted into first.
  # The S3 Tables integration (AWS::ObservabilityAdmin::S3TableIntegration) and the
  # "amazon_s3 / server_access" data source association it enables are both single
  # resources scoped to the whole account and Region — not owned by, or scoped to, any
  # one stack or bucket. Creating the integration unconditionally via a plain
  # CloudFormation resource would fail if another stack, service, or a previous run of
  # this same stack already created it. This custom resource is therefore idempotent:
  # it checks whether an integration already exists for the account/Region and reuses
  # it if so, creating one only when none exists, then associates the account-wide
  # "amazon_s3 / server_access" log source with it so all S3 server access logs
  # delivered to CloudWatch Logs in this account/Region (including this stack's) are
  # mirrored to the shared "aws-cloudwatch" S3 Tables managed table bucket in Iceberg
  # format.
  #
  # On stack delete, this custom resource intentionally does nothing: it never
  # disassociates the data source or deletes the integration, since both are
  # account-and-Region-wide and other buckets, stacks, or AWS services may depend on
  # them. See PERMISSIONS.md for manual cleanup instructions.

  S3TableIntegrationRole:
    Type: AWS::IAM::Role
    Condition: S3TablesIntegrationEnabled
    # Retained because the integration that holds its ARN is. That integration is
    # account-and-Region-wide and shared, which is why the custom resource's
    # Delete is a no-op, and nothing ever updates the ARN it stored. So deleting
    # this stack, or turning either server-access-logs parameter off, used to
    # delete the role the surviving integration still pointed at and break
    # mirroring for every other stack in the Region.
    #
    # Leaves an orphaned role once the last stack goes; PERMISSIONS.md, "S3
    # Tables integration for server access logs", covers removing it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${AWS::StackName}-s3tableintegration-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: IntegrateWithS3Table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to CloudWatch Logs log groups in this account and Region.
              # logs:integrateWithS3Table does support a specific log group ARN as
              # its Resource (see "Access logs with S3 Tables Integration" in the
              # CloudWatch Logs User Guide), but pinning it to this stack's own log
              # group would break the feature: the integration this role is passed
              # to is a single account-and-Region-wide resource, and the data source
              # it associates is the amazon_s3/server_access log *type*, not one log
              # group. Every S3 server access log delivery in the account/Region
              # flows through whichever integration exists, so a single-log-group
              # Resource would deny mirroring for every other bucket sharing it --
              # including buckets this stack knows nothing about. See
              # S3TableIntegrationSetupFunction and OPERATIONS.md,
              # "Account-and-Region-wide resource, shared across stacks".
              - Effect: Allow
                Action: logs:integrateWithS3Table
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Condition:
                  StringEquals:
                    'aws:ResourceAccount': !Ref 'AWS::AccountId'

  S3TableIntegrationSetupRole:
    Type: AWS::IAM::Role
    Condition: S3TablesIntegrationEnabled
    Properties:
      RoleName: !Sub '${AWS::StackName}-s3tableintegsetup-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageS3TableIntegration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - observabilityadmin:CreateS3TableIntegration
                  - observabilityadmin:ListS3TableIntegrations
                  - observabilityadmin:GetS3TableIntegration
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:AssociateSourceToS3TableIntegration
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt S3TableIntegrationRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': 'logs.amazonaws.com'
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-s3tableintegsetup:*

  S3TableIntegrationSetupFunction:
    Type: AWS::Lambda::Function
    Condition: S3TablesIntegrationEnabled
    DependsOn: S3TableIntegrationSetupLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-s3tableintegsetup'
      Description: >-
        Ensures an account-wide CloudWatch Logs S3 Tables integration exists and
        associates the amazon_s3/server_access log source. Never disassociates or
        deletes on stack delete, since both are account-wide and shared.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt S3TableIntegrationSetupRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', 's3-table-integration-setup')
              props = event.get('ResourceProperties', {})
              role_arn = props.get('RoleArn', '')
              data_source_name = props.get('DataSourceName', 'amazon_s3')
              data_source_type = props.get('DataSourceType', 'server_access')
              kms_key_arn = props.get('KmsKeyArn', '')

              try:
                  req_type = event['RequestType']

                  if req_type == 'Delete':
                      # Deliberate no-op. The "amazon_s3 / server_access" data source
                      # association and the integration itself are account-and-Region
                      # wide and may be relied on by other buckets/stacks. Disassociating
                      # or deleting them here would silently stop S3 Tables mirroring
                      # for those other resources too.
                      _cfn_send(event, context, 'SUCCESS', {}, physical_id)
                      return

                  logs_client = boto3.client('logs')
                  oa_client = boto3.client('observabilityadmin')
                  integration_arn = _find_integration_arn(oa_client)
                  if not integration_arn:
                      # Honour the stack's KMSKeyArn when one was supplied, matching
                      # every other encryptable resource in this template
                      # (SolutionBucket, SNS topic, SQS DLQ, log groups all switch on
                      # HasKMSKey). CreateS3TableIntegration accepts KmsKeyArn
                      # alongside SseAlgorithm 'aws:kms'.
                      #
                      # This only ever runs on the CREATE path. The integration is a
                      # single account-and-Region-wide resource and
                      # _find_integration_arn reuses an existing one untouched, so
                      # deploying into an account that already has one never changes
                      # its encryption. The flip side: when this stack is the one that
                      # creates it, every other bucket's mirrored server access log
                      # data in this account and Region is encrypted under this
                      # stack's key. Any principal reading those tables then needs
                      # kms:Decrypt on it, and the CloudWatch Logs and S3 Tables
                      # service principals need key policy grants. See PERMISSIONS.md,
                      # "S3 Tables integration for server access logs", before
                      # supplying a key in a shared account.
                      if kms_key_arn:
                          encryption = {'SseAlgorithm': 'aws:kms',
                                        'KmsKeyArn': kms_key_arn}
                      else:
                          encryption = {'SseAlgorithm': 'AES256'}
                      create_resp = oa_client.create_s3_table_integration(
                          Encryption=encryption,
                          RoleArn=role_arn
                      )
                      integration_arn = create_resp['Arn']

                  logs_client.associate_source_to_s3_table_integration(
                      integrationArn=integration_arn,
                      dataSource={'name': data_source_name, 'type': data_source_type}
                  )

                  _cfn_send(event, context, 'SUCCESS',
                            {'IntegrationArn': integration_arn}, integration_arn)

              except Exception as exc:
                  _cfn_send(event, context, 'FAILED', {}, physical_id, str(exc))

          def _find_integration_arn(oa_client):
              paginator = oa_client.get_paginator('list_s3_table_integrations')
              for page in paginator.paginate():
                  integrations = page.get('S3TableIntegrationSummaries', page.get('Items', []))
                  if integrations:
                      return integrations[0].get('Arn')
              return None

          def _cfn_send(event, context, status, data, physical_id, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or
                             'See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # Bounded: a ResponseURL that blackholes would otherwise hold the
              # invocation open for the function's whole timeout.
              urllib.request.urlopen(req, timeout=10)

  S3TableIntegrationSetup:
    Type: Custom::S3TableIntegrationSetup
    Condition: S3TablesIntegrationEnabled
    DependsOn: ServerAccessLogsDelivery
    Properties:
      ServiceToken: !GetAtt S3TableIntegrationSetupFunction.Arn
      RoleArn: !GetAtt S3TableIntegrationRole.Arn
      # dataSource.name/type identify the log *source type* being associated (fixed
      # values for S3 server access logs), not this stack's delivery source name.
      DataSourceName: amazon_s3
      DataSourceType: server_access
      # Absent when no KMSKeyArn was supplied, which leaves the integration on
      # SSE-S3. See the encryption comment in S3TableIntegrationSetupFunction for
      # why this only takes effect on the create path.
      KmsKeyArn: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  # ── Prerequisite check ───────────────────────────────────────────────────────────────
  # PrereqCheck is a CloudFormation custom resource that validates S3 Object Lock and
  # Versioning are both enabled on the TargetBucket before any downstream resources are
  # created. If either prerequisite is missing the stack deployment fails immediately
  # with a descriptive error identifying the missing prerequisite (Req 1.2, 1.3).

  PrereqCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-prereqcheck-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3BucketPrereqRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketVersioning
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${TargetBucket}'
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-prereqcheck:*

  PrereqCheckFunction:
    Type: AWS::Lambda::Function
    DependsOn: PrereqCheckLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-prereqcheck'
      Description: >-
        CloudFormation custom resource. Validates that S3 Object Lock and Versioning are
        both enabled on the TargetBucket at deploy time. Fails the stack with a
        descriptive error identifying the missing prerequisite (Req 1.2, 1.3).
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt PrereqCheckRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', 'prereq-check')
              props = event.get('ResourceProperties', {})
              target_bucket = props.get('TargetBucket', '')

              try:
                  req_type = event['RequestType']

                  if req_type == 'Delete':
                      _cfn_send(event, context, 'SUCCESS', {}, physical_id)
                      return

                  if req_type == 'Update':
                      old_bucket = event.get('OldResourceProperties', {}).get('TargetBucket', '')
                      if old_bucket and old_bucket != target_bucket:
                          _cfn_send(event, context, 'FAILED', {}, physical_id,
                              f"Cannot change TargetBucket from '{old_bucket}' to '{target_bucket}'"
                              f" on stack update. Deploy a new stack targeting '{target_bucket}'.")
                          return
                      # bucket unchanged — fall through and re-validate prerequisites

                  # Create (and Update where bucket is unchanged): validate prerequisites
                  _validate_prereqs(event, context, target_bucket, physical_id)

              except Exception as exc:
                  _cfn_send(event, context, 'FAILED', {}, physical_id, str(exc))

          def _validate_prereqs(event, context, target_bucket, physical_id):
              s3 = boto3.client('s3')

              # ── Object Lock check ─────────────────────────────────────────────────────
              try:
                  resp = s3.get_object_lock_configuration(Bucket=target_bucket)
                  cfg = resp.get('ObjectLockConfiguration', {})
                  if cfg.get('ObjectLockEnabled') != 'Enabled':
                      _cfn_send(event, context, 'FAILED', {}, physical_id,
                          f"S3 Object Lock is not enabled on bucket '{target_bucket}'. "
                          "Enable Object Lock and Versioning before deploying.")
                      return
              except ClientError as exc:
                  code = exc.response['Error']['Code']
                  if code in ('ObjectLockConfigurationNotFoundError',
                               'NoSuchObjectLockConfiguration'):
                      _cfn_send(event, context, 'FAILED', {}, physical_id,
                          f"S3 Object Lock is not enabled on bucket '{target_bucket}'. "
                          "Enable Object Lock and Versioning before deploying.")
                      return
                  if code == 'NoSuchBucket':
                      _cfn_send(event, context, 'FAILED', {}, physical_id,
                          f"Bucket '{target_bucket}' does not exist or is not accessible"
                          " from this account and Region.")
                      return
                  raise

              # ── Versioning check ──────────────────────────────────────────────────────
              v_resp = s3.get_bucket_versioning(Bucket=target_bucket)
              if v_resp.get('Status') != 'Enabled':
                  _cfn_send(event, context, 'FAILED', {}, physical_id,
                      f"S3 Versioning is not enabled on bucket '{target_bucket}'. "
                      "Enable Versioning before deploying.")
                  return

              # Both prerequisites satisfied
              _cfn_send(event, context, 'SUCCESS', {}, physical_id)

          def _cfn_send(event, context, status, data, physical_id, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or
                             'See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # Bounded: a ResponseURL that blackholes would otherwise hold the
              # invocation open for the function's whole timeout.
              urllib.request.urlopen(req, timeout=10)

  PrereqCheck:
    Type: Custom::PrereqCheck
    DependsOn: SolutionBucket
    Properties:
      ServiceToken: !GetAtt PrereqCheckFunction.Arn
      TargetBucket: !Ref TargetBucket

  # ── Inventory configuration ──────────────────────────────────────────────────────────
  # InventoryConfig is a CloudFormation custom resource that creates a dedicated
  # version-level S3 Inventory configuration on the TargetBucket, independent of any
  # existing inventory configurations. On stack delete it removes only this stack's
  # configuration (identified by the stack name as the Id), leaving all other inventory
  # configurations untouched (Req 1.6, 1.7, 11.3).

  InventoryConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-inventoryconfig-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3InventoryConfigManage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutInventoryConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${TargetBucket}'
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-inventoryconfig:*

  InventoryConfigFunction:
    Type: AWS::Lambda::Function
    DependsOn: InventoryConfigLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-inventoryconfig'
      Description: >-
        Creates and removes this stack's version-level S3 Inventory configuration.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt InventoryConfigRole.Arn
      Timeout: 60
      Environment:
        Variables:
          TARGET_BUCKET: !Ref TargetBucket
          SOLUTION_BUCKET: !Ref SolutionBucket
          PREFIX: !Ref Prefix
          DETECTION_SCHEDULE: !Ref DetectionSchedule
          INVENTORY_ID: !Sub '${AWS::StackName}'
      Code:
        ZipFile: |
          import json
          import os
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError

          def handler(event, context):
              props = event.get('ResourceProperties', {})
              physical_id = event.get(
                  'PhysicalResourceId',
                  os.environ.get('INVENTORY_ID', 'inventory-config')
              )

              try:
                  deployed = {
                      'TargetBucket': os.environ['TARGET_BUCKET'],
                      'SolutionBucket': os.environ['SOLUTION_BUCKET'],
                      'Prefix': os.environ['PREFIX'],
                      'DetectionSchedule': os.environ['DETECTION_SCHEDULE'],
                      'InventoryId': os.environ['INVENTORY_ID'],
                  }
                  for field_name, expected_value in deployed.items():
                      if props.get(field_name) != expected_value:
                          raise ValueError(
                              f"ResourceProperties {field_name} does not match "
                              "the deployed stack configuration"
                          )

                  target_bucket = deployed['TargetBucket']
                  solution_bucket = deployed['SolutionBucket']
                  prefix = deployed['Prefix']
                  detection_schedule = deployed['DetectionSchedule']
                  inventory_id = deployed['InventoryId']
                  req_type = event['RequestType']
                  s3 = boto3.client('s3')
                  account_id = context.invoked_function_arn.split(':')[4]
                  partition = context.invoked_function_arn.split(':')[1]

                  if req_type == 'Delete':
                      try:
                          s3.delete_bucket_inventory_configuration(
                              Bucket=target_bucket,
                              Id=inventory_id
                          )
                      except ClientError as exc:
                          code = exc.response['Error']['Code']
                          if code not in ('NoSuchConfiguration',
                                          'NoSuchInventoryConfiguration'):
                              raise
                      _cfn_send(event, context, 'SUCCESS', {}, physical_id)
                      return

                  # Create or Update: map DetectionSchedule to API title case
                  frequency = 'Daily' if detection_schedule.upper() == 'DAILY' else 'Weekly'

                  inventory_config = {
                      'Id': inventory_id,
                      'IsEnabled': True,
                      'Destination': {
                          'S3BucketDestination': {
                              'AccountId': account_id,
                              'Bucket': f'arn:{partition}:s3:::{solution_bucket}',
                              'Format': 'Parquet',
                              'Prefix': 'inventory'
                          }
                      },
                      'IncludedObjectVersions': 'All',
                      'OptionalFields': [
                          'Size', 'LastModifiedDate',
                          'ObjectLockMode', 'ObjectLockRetainUntilDate',
                          'ObjectLockLegalHoldStatus',
                          # Request only what a query reads, plus fields whose enum
                          # values are already proven. The event-hold DURATION fields
                          # are deliberately NOT requested: no query projects them, so
                          # they add no value, while every requested field is one more
                          # enum string that must be valid -- an invalid OptionalFields
                          # value fails this custom resource and rolls the stack back.
                          # If S3 Inventory delivers duration columns anyway they are
                          # reported in _verify_inventory_schema's undeclared_columns
                          # log line, which is better reconnaissance than declaring a
                          # guessed name.
                          'ObjectLockEventHoldStatus'
                      ],
                      'Schedule': {'Frequency': frequency}
                  }

                  if prefix:
                      inventory_config['Filter'] = {'Prefix': prefix}

                  s3.put_bucket_inventory_configuration(
                      Bucket=target_bucket,
                      Id=inventory_id,
                      InventoryConfiguration=inventory_config
                  )

                  _cfn_send(event, context, 'SUCCESS',
                            {'InventoryId': inventory_id}, physical_id)

              except Exception as exc:
                  _cfn_send(event, context, 'FAILED', {}, physical_id, str(exc))


          def _cfn_send(event, context, status, data, physical_id, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or
                             'See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # Bounded: a ResponseURL that blackholes would otherwise hold the
              # invocation open for the function's whole timeout.
              urllib.request.urlopen(req, timeout=10)

  InventoryConfig:
    Type: Custom::InventoryConfig
    DependsOn: PrereqCheck
    Properties:
      ServiceToken: !GetAtt InventoryConfigFunction.Arn
      TargetBucket: !Ref TargetBucket
      SolutionBucket: !Ref SolutionBucket
      Prefix: !Ref Prefix
      DetectionSchedule: !Ref DetectionSchedule
      InventoryId: !Sub '${AWS::StackName}'

  # ── Glue database and table ──────────────────────────────────────────────────────────
  # External Parquet table over S3 Inventory deliveries with partition projection on
  # dt (the delivery date-time directory, e.g. 2026-01-15T01-00Z). No crawler required.
  # The database name is derived from the lowercase stack name so multiple deployments
  # can coexist without name collisions. Glue requires lowercase database names.

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub
          - '${Lower}-db'
          - Lower: !GetAtt LowerCase.Lower
        Description: >-
          Glue database for the Automatic Event Hold Release for Amazon S3 Object Lock
          solution. Contains the external inventory table used by Athena for
          eligibility evaluation.

  GlueTable:
    Type: AWS::Glue::Table
    DependsOn:
      - GlueDatabase
      - InventoryConfig
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Sub
        - '${Lower}-db'
        - Lower: !GetAtt LowerCase.Lower
      TableInput:
        Name: inventory
        Description: >-
          External table over version-level S3 Inventory deliveries, read via the
          Hive-compatible symlink manifest S3 Inventory publishes under hive/dt=.../
          (SymlinkTextInputFormat). This is required because S3 Inventory writes each
          delivery's actual Parquet data files into a FLAT, shared data/ folder --
          not nested under a per-delivery timestamp folder -- so a plain Parquet
          table pointed at a dt-named folder finds no data there; only the symlink
          manifest correctly resolves to that delivery's specific file(s). Partition
          projection (type=date) means partitions are computed by Athena directly
          from the dt value, not registered via the Glue API.
        TableType: EXTERNAL_TABLE
        Parameters:
          'projection.enabled': 'true'
          'projection.dt.type': 'date'
          # S3 Inventory's hive/ manifest folder names use dashes only (no T/Z), a
          # DIFFERENT format from the dt value in the manifest.json delivery path
          # (which keeps T/Z, e.g. 2026-07-18T01-00Z) -- confirmed against a real
          # delivery. StartQueryFunction converts between the two formats before
          # using dt in SQL; see _to_hive_dt.
          'projection.dt.format': 'yyyy-MM-dd-HH-mm'
          'projection.dt.range': '2024-01-01-00-00,NOW'
          'projection.dt.interval': '1'
          'projection.dt.interval.unit': 'HOURS'
          'classification': 'parquet'
        StorageDescriptor:
          Columns:
            - Name: bucket
              Type: string
            - Name: key
              Type: string
            - Name: version_id
              Type: string
            # Confirmed against a real S3 Inventory delivery's manifest.json
            # fileSchema and the actual Parquet file: is_latest and
            # is_delete_marker are native BOOLEAN, and last_modified_date /
            # object_lock_retain_until_date are native TIMESTAMP -- not STRING.
            - Name: is_latest
              Type: boolean
            - Name: is_delete_marker
              Type: boolean
            - Name: size
              Type: bigint
            - Name: last_modified_date
              Type: timestamp
            # No e_tag or storage_class column: InventoryConfigFunction does not
            # request the ETag or StorageClass OptionalFields, so S3 Inventory never
            # delivers them and no query reads them. Declaring them would be inert
            # (Athena reads Parquet by name and yields NULL for a declared column
            # the file lacks), but it would also misrepresent the delivered schema.
            - Name: object_lock_retain_until_date
              Type: timestamp
            - Name: object_lock_mode
              Type: string
            - Name: object_lock_legal_hold_status
              Type: string
            - Name: object_lock_event_hold_status
              Type: string
            # No event-hold duration columns: InventoryConfigFunction does not request
            # the ObjectLockEventHoldDuration OptionalFields, so S3 Inventory never
            # delivers them and no query reads them -- same reasoning as e_tag and
            # storage_class above.
          # Base location for Athena's default partition path convention
          # (<Location>/dt=<value>/), matching the hive/ folder S3 Inventory
          # publishes its per-delivery symlink manifests under.
          Location: !Sub 's3://${SolutionBucket}/inventory/${TargetBucket}/${AWS::StackName}/hive/'
          InputFormat: org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
        PartitionKeys:
          - Name: dt
            Type: string

  # ── Previous-manifest table (dedup) ──────────────────────────────────────────────────
  # External CSV table over manifests/previous/{mode}/manifest.csv, the manifest most
  # recently submitted as a NON-SUSPENDED S3PutObjectRetention job for that mode.
  # CreateJob overwrites the per-mode object only after creating a job with
  # ConfirmationRequired=false (i.e. ReportOnly=false and under SafetyThreshold) --
  # never for a suspended (ReportOnly=true) or withheld job. StartQuery anti-joins
  # every eligibility query (both the fast `either` path and the delete/overwrite
  # superseder-classification path) against this table so a version whose release may still be in
  # flight, or already succeeded, from the most recent qualifying run is not
  # re-submitted to a second Batch Operations job. This bounds duplicate job creation
  # to at most one extra run -- see README "Idempotency" and "Operating at scale".
  #
  # Partition projection type=enum (not injected) because there are exactly two valid
  # values (COMPLIANCE, GOVERNANCE), known in advance -- unlike dt, which is an
  # unbounded, delivery-time-dependent value that injected projection is designed for.

  PreviousManifestTable:
    Type: AWS::Glue::Table
    DependsOn: GlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Sub
        - '${Lower}-db'
        - Lower: !GetAtt LowerCase.Lower
      TableInput:
        Name: previous_manifest
        Description: >-
          External CSV table over the per-mode manifest most recently submitted as a
          non-suspended S3PutObjectRetention job. Used to anti-join eligibility queries
          against versions whose release may already be in flight or complete.
        TableType: EXTERNAL_TABLE
        Parameters:
          'projection.enabled': 'true'
          'projection.mode.type': 'enum'
          'projection.mode.values': 'COMPLIANCE,GOVERNANCE'
          'storage.location.template': !Sub
            - 's3://${SolutionBucket}/manifests/previous/${ModeLiteral}/'
            - ModeLiteral: '${mode}'
          'classification': 'csv'
          'skip.header.line.count': '0'
        StorageDescriptor:
          # All three columns of the manifest CSV, in write order, because
          # LazySimpleSerDe maps fields to columns by position and not by name.
          # The file here is the Batch Operations eligibility manifest copied
          # verbatim, so it carries the three fields Manifest.Spec.Fields
          # requires: bucket, url_encode(key), version_id.
          #
          # Omitting `bucket` shifts every field left, which binds `key` to the
          # bucket name and makes the dedup anti-join in _build_candidate_ctes
          # match nothing, silently. Guarded by
          # test_previous_manifest_columns_match_the_unload_projection.
          Columns:
            - Name: bucket
              Type: string
            - Name: key
              Type: string
            - Name: version_id
              Type: string
          Location: !Sub 's3://${SolutionBucket}/manifests/previous/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              'field.delim': ','
        PartitionKeys:
          - Name: mode
            Type: string

  # ── Withheld-candidates diagnostic history table ─────────────────────────────────────
  # External CSV table over diagnostics/withheld-candidates/{dt}/manifest.csv, one file
  # per inventory delivery, listing every candidate (noncurrent, hold=ON data version)
  # that StartQuery's per-candidate ambiguity predicate withheld from automatic
  # eligibility that run -- exactly the versions the delete/overwrite eligibility path
  # excluded via superseder_kinds > 1 (see README "Timestamp ties fail closed"). Purely
  # diagnostic: nothing in the pipeline re-reads this table, and it never gates or
  # re-verifies an eligibility or job decision. Retained 90 days by the SolutionBucket
  # lifecycle rule on diagnostics/withheld-candidates/ (same window as completion
  # reports, since both are audit/diagnostic data meant to be reviewed over time).
  #
  # Partition projection type=injected, matching GlueTable's dt convention (raw
  # YYYY-MM-DDThh-mmZ value, no "dt=" key=value prefix) so both tables can be joined
  # or compared by dt without a format mismatch.

  WithheldCandidatesHistoryTable:
    Type: AWS::Glue::Table
    DependsOn: GlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Sub
        - '${Lower}-db'
        - Lower: !GetAtt LowerCase.Lower
      TableInput:
        Name: withheld_candidates_history
        Description: >-
          External CSV table over per-run diagnostic listings of candidates withheld
          from automatic eligibility because their superseder classification is
          ambiguous (timestamp ties). Query this table to see which versions are
          currently withheld, why (reason column), and for how long, e.g. by
          filtering to the most recent dt partition.
        TableType: EXTERNAL_TABLE
        Parameters:
          'projection.enabled': 'true'
          'projection.dt.type': 'injected'
          'storage.location.template': !Sub
            - 's3://${SolutionBucket}/diagnostics/withheld-candidates/${DtLiteral}/'
            - DtLiteral: '${dt}'
          'classification': 'csv'
          'skip.header.line.count': '0'
        StorageDescriptor:
          Columns:
            - Name: key
              Type: string
            - Name: version_id
              Type: string
            - Name: object_lock_mode
              Type: string
            - Name: last_modified_date
              Type: string
            - Name: reason
              Type: string
          Location: !Sub 's3://${SolutionBucket}/diagnostics/withheld-candidates/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              'field.delim': ','
        PartitionKeys:
          - Name: dt
            Type: string

  # ── Athena WorkGroup ─────────────────────────────────────────────────────────────────

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${AWS::StackName}-wg'
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub 's3://${SolutionBucket}/athena-results/'
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false

  # ── Pipeline dead-letter queue ──────────────────────────────────────────────────────
  # Shared SQS dead-letter queue for the three event-driven pipeline Lambdas
  # (StartQuery, ManifestMaker, CreateJob). S3 retries event notifications up to three
  # times; after exhaustion, the failed invocation record lands here so it can be
  # inspected and replayed rather than silently dropped.

  PipelineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-pipeline-dlq'
      MessageRetentionPeriod: 1209600  # 14 days (maximum)
      KmsMasterKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  # Deny-only policy: it grants nothing, so the four pipeline Lambdas keep writing
  # to the DLQ through the sqs:SendMessage grant in their own execution roles. This
  # closes the one gap of the three transport-security statements in this template --
  # SolutionBucketPolicy has DenyUnencryptedTransport and SNSTopicPolicy has
  # DenyInsecureTransport; the queue previously had no equivalent. Unlike SNS, whose
  # topic policies reject an sqs:*-style wildcard as out of service scope, SQS
  # accepts sqs:* here.
  PipelineDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PipelineDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            # The service wildcard is deliberate and is safe ONLY because this is a
            # Deny: it blocks every SQS operation on this queue when the request did
            # not arrive over TLS, so it must cover actions this template does not
            # itself use. Do not copy this wildcard into an Allow statement -- an
            # Allow on sqs:* would grant queue administration (DeleteQueue,
            # SetQueueAttributes, AddPermission) alongside messaging. The pipeline's
            # own grant is a single action, sqs:SendMessage, in each Lambda
            # execution role; scope any Allow the same way.
            Action: 'sqs:*'
            Resource: !GetAtt PipelineDLQ.Arn
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── StartQuery Lambda ────────────────────────────────────────────────────────────────
  # Triggered by inventory manifest delivery. Verifies the delivery's manifest.json
  # fileSchema carries every column the eligibility SQL reads (see
  # _REQUIRED_INVENTORY_COLUMNS -- a missing column would otherwise yield a silently
  # empty result, not an error), then starts one eligibility UNLOAD per ObjectLockMode.
  # No Glue partition registration: GlueTable uses partition projection, so Athena
  # computes partition locations itself. Uses S3 event sequencer as
  # ClientRequestToken to prevent duplicate queries on retries (Req 10.3).
  # Eligibility SQL enforces Req 4.1 (no current versions) and Req 4.2 (correct
  # supersession classification via the current_versions CTE).

  StartQueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-startquery-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AthenaQueryExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: !Sub 'arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AWS::StackName}-wg'
        - PolicyName: GlueTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Both the inventory table (date-type projection) and
              # previous_manifest (enum-type projection) are fully projected --
              # Athena computes their partition locations itself and never calls
              # the Glue partition APIs, so StartQuery only ever needs
              # GetDatabase/GetTable/GetPartitions to resolve each projected table
              # definition. No CreatePartition/BatchCreatePartition grant: this
              # role never registers a partition (removed as dead code once
              # partition projection was already governing lookup; confirmed
              # against a real S3 Inventory delivery).
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${Lower}-db'
                    - Lower: !GetAtt LowerCase.Lower
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${Lower}-db/inventory'
                    - Lower: !GetAtt LowerCase.Lower
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${Lower}-db/previous_manifest'
                    - Lower: !GetAtt LowerCase.Lower
        - PolicyName: S3InventoryRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/inventory/*'
                  # Athena's standard (non-federated) query engine reads S3 data
                  # using the credentials of the calling principal -- here,
                  # StartQueryRole itself, since it calls StartQueryExecution --
                  # not a separate Athena-managed execution role. The
                  # previous_manifest anti-join therefore needs a direct S3 read
                  # grant on its backing data, in addition to the Glue catalog
                  # grant above.
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/previous/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - 'inventory/*'
                      - 'manifests/parts/*'
                      - 'manifests/previous/*'
                      - 'athena-results/*'
              # Athena's StartQueryExecution calls s3:GetBucketLocation on the
              # ResultConfiguration.OutputLocation bucket to verify/create it before
              # running any query -- unconditionally, for every query, regardless of
              # the query's own S3 read/write scope. Without this grant every query
              # fails immediately with InvalidRequestException: "Unable to
              # verify/create output bucket" (confirmed against a real deployment).
              # No prefix condition: this check targets the bucket itself, not a key.
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
        - PolicyName: S3UnloadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # No s3:DeleteObject: StartQuery never deletes objects (Athena UNLOAD
              # writes to a per-run sequencer-unique prefix and needs no cleanup, and
              # Athena result output requires only Get/Put/List). Withholding delete
              # narrows the manifest-part replacement vector -- a compromised role can
              # add parts but cannot cleanly delete and substitute genuine UNLOAD output.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/parts/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/athena-results/*'
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-startquery:*
        - PolicyName: DLQSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn
        - !If
          - HasKMSKey
          - PolicyName: KMSDecryptAndGenerate
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref KMSKeyArn
          - !Ref 'AWS::NoValue'

  StartQueryFunction:
    Type: AWS::Lambda::Function
    DependsOn: StartQueryLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-startquery'
      Description: >-
        Counts eligible versions, writes per-mode manifests, and emits completion metadata.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt StartQueryRole.Arn
      Timeout: 900
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      Environment:
        Variables:
          SOLUTION_BUCKET: !Ref SolutionBucket
          GLUE_DATABASE: !Sub
            - '${Lower}-db'
            - Lower: !GetAtt LowerCase.Lower
          GLUE_TABLE: inventory
          PREVIOUS_MANIFEST_TABLE: previous_manifest
          ATHENA_WORKGROUP: !Sub '${AWS::StackName}-wg'
          TARGET_BUCKET: !Ref TargetBucket
          INVENTORY_ID: !Sub '${AWS::StackName}'
          RELEASE_MODE: !Ref ReleaseMode
      Code:
        ZipFile: |
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse
          import boto3

          # S3 Inventory delivery timestamp: YYYY-MM-DDThh-mmZ
          _DT_PATTERN = re.compile(
              r'\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}Z\Z'
          )

          # S3 event sequencers are hex-encoded strings (typically 16 chars for
          # PUT/DELETE). Validated before use in S3 key paths or SQL to prevent
          # path manipulation and SQL injection via a crafted/direct-invoke event.
          _SEQUENCER_PATTERN = re.compile(r'\A[0-9A-Fa-f]{1,64}\Z')

          # Field declarations inside an S3 Inventory manifest.json "fileSchema"
          # string. Parquet deliveries carry a Parquet message schema, e.g.
          #   message s3.inventory {  required binary bucket (STRING);
          #   optional boolean is_latest;
          #   optional int64 last_modified_date (TIMESTAMP(MILLIS,true));}
          # The field NAME (group 2) always follows the repetition and type
          # tokens; logical-type annotations are parenthesised AFTER the name, so
          # they never match. Confirmed against a real delivery's manifest.json.
          _PARQUET_FIELD_PATTERN = re.compile(
              r'\b(?:required|optional|repeated)\s+(\w+)\s+(\w+)'
          )

          # The inventory columns the eligibility SQL actually reads -- see
          # _build_candidate_ctes and _build_superseder_ctes. Deliberately NOT the
          # full GlueTable column list: size, object_lock_retain_until_date and
          # object_lock_legal_hold_status are declared for completeness but are
          # never projected by any query, so their absence cannot change a result
          # and is logged rather than raised. `bucket` is excluded too -- the
          # manifest UNLOAD emits the literal Target_Bucket name, it does not read
          # the inventory column. `dt` is a projected partition key, not a data
          # column.
          #
          # WHY THIS GUARD EXISTS. Athena resolves Parquet columns by NAME and
          # yields NULL for a Glue-declared column that the data file does not
          # contain -- it does not raise. So if the column names S3 Inventory
          # delivers ever diverge from what GlueTable declares, the predicate
          # `object_lock_event_hold_status = 'ON'` matches zero rows: the run
          # reports 0 eligible versions and SUCCEEDS, with no error, no DLQ
          # message, and no alarm, for as long as the mismatch persists. A
          # zero-eligible run is indistinguishable from a healthy one, which makes
          # this the only failure in the pipeline that is silent by default --
          # every other stage raises and reaches the DLQ. Verifying the delivered
          # schema up front converts it into a loud failure.
          _REQUIRED_INVENTORY_COLUMNS = frozenset({
              'key',
              'version_id',
              'is_latest',
              'is_delete_marker',
              'last_modified_date',
              'object_lock_mode',
              'object_lock_event_hold_status',
          })

          # Declared by GlueTable but never projected by any query. Absence is
          # reported for drift visibility only; it never fails a run.
          #
          # DO NOT move object_lock_retain_until_date into a query predicate. While
          # an event hold is ON, S3 Inventory reports a ROLLING retain-until-date of
          # (report generation time + configured duration), recomputed on every
          # delivery -- it is not fixed at write time. Confirmed from a real delivery
          # generated 2026-08-13: five objects written between 2026-08-03 and
          # 2026-08-12, each carrying a 1 YEARS hold, ALL reported
          # 2027-08-13T00:00:00.000Z -- that report's own creationTimestamp plus one
          # year, with no relation to any object's creation time. Eligibility logic
          # comparing this column against a date would therefore drift between runs,
          # and unit fixtures with static timestamps would not catch it. The value
          # only settles once the hold is released, which is why "retain-until-date
          # has stopped advancing" is the post-release verification signal and never
          # an input to selection.
          _OPTIONAL_INVENTORY_COLUMNS = frozenset({
              'bucket',
              'size',
              'object_lock_retain_until_date',
              'object_lock_legal_hold_status',
          })


          def handler(event, context):
              solution_bucket = os.environ['SOLUTION_BUCKET']
              db_name = os.environ['GLUE_DATABASE']
              table_name = os.environ['GLUE_TABLE']
              previous_manifest_table = os.environ['PREVIOUS_MANIFEST_TABLE']
              workgroup = os.environ['ATHENA_WORKGROUP']
              target_bucket = os.environ['TARGET_BUCKET']
              inventory_id = os.environ['INVENTORY_ID']
              release_mode = os.environ['RELEASE_MODE']

              # Parse the S3 event record
              record = event['Records'][0]
              raw_key = record['s3']['object']['key']
              key = urllib.parse.unquote_plus(raw_key)
              sequencer = record['s3']['object']['sequencer']

              # Key format: inventory/{target_bucket}/{inventory_id}/{dt}/manifest.json
              key_parts = key.split('/')
              dt = key_parts[3]

              # Validate dt against the S3 Inventory delivery timestamp format.
              # Abort before any Glue or Athena call if the value is unexpected —
              # prevents SQL injection and partition-location poisoning (Req 2.1–2.3).
              if not _DT_PATTERN.match(dt):
                  print(json.dumps({
                      'event': 'dt_validation_failed',
                      'dt': dt,
                      'key': key,
                      'reason': 'dt does not match expected YYYY-MM-DDThh-mmZ format',
                  }))
                  raise ValueError(
                      f"Invalid dt '{dt}' extracted from key '{key}'; "
                      "expected S3 Inventory format YYYY-MM-DDThh-mmZ"
                  )

              # Validate sequencer before it is used in the UNLOAD output S3 path
              # (embedded directly in Athena SQL) or the ClientRequestToken. S3's
              # own sequencers always match this format; a value that doesn't is
              # either a malformed event or a direct, non-S3-triggered invocation
              # and must not be trusted for SQL or key-path construction.
              if not _SEQUENCER_PATTERN.match(sequencer):
                  print(json.dumps({
                      'event': 'sequencer_validation_failed',
                      'sequencer': sequencer,
                      'key': key,
                      'reason': 'sequencer does not match expected hex format',
                  }))
                  raise ValueError(
                      f"Invalid sequencer '{sequencer}' in event for key '{key}'; "
                      "expected a hex-encoded S3 event sequencer"
                  )

              # Verify this delivery actually carries the columns the eligibility
              # SQL reads, BEFORE any Athena call. Raises on a mismatch rather than
              # letting Athena's NULL-for-missing-column behavior turn it into a
              # successful zero-eligible run (see _REQUIRED_INVENTORY_COLUMNS).
              # The triggering object IS the delivery's manifest.json -- the S3
              # notification filters on that suffix -- so no lookup is needed, and
              # StartQueryRole's existing s3:GetObject on inventory/* covers it.
              s3 = boto3.client('s3')
              _verify_inventory_schema(s3, solution_bucket, key)

              # No explicit Glue partition registration: GlueTable has
              # projection.enabled=true, so Athena computes partition locations
              # itself from the dt column value and IGNORES any partition metadata
              # registered in the Glue Data Catalog (confirmed via AWS's partition
              # projection documentation). SQL below uses hive_dt (the dt value in
              # the format Athena's partition projection expects, matching S3
              # Inventory's hive/dt=.../ symlink-manifest folder naming), not the
              # raw manifest-path dt (which uses a different format -- see
              # _to_hive_dt).
              hive_dt = _to_hive_dt(dt)

              # Count eligible rows before creating any manifest or Batch Operations
              # job. GetQueryExecution does not expose a DML row count for UNLOAD, so
              # dedicated COUNT(*) queries are the authoritative safety-control input.
              athena = boto3.client('athena')
              modes = ['COMPLIANCE', 'GOVERNANCE']
              deadline = time.time() + 13 * 60
              count_query_ids = {}
              count_query_hashes = {}

              for mode in modes:
                  sql = _build_count_query(
                      mode, hive_dt, target_bucket, release_mode,
                      table_name, previous_manifest_table,
                  )
                  count_query_hashes[mode] = hashlib.sha256(sql.encode()).hexdigest()
                  count_query_ids[mode] = _start_query(
                      athena, sql, db_name, workgroup, solution_bucket,
                      dt, mode, 'count',
                  )

              # The withheld-candidates diagnostic reports exactly the candidates
              # the eligibility queries above withheld due to ambiguous superseder
              # classification -- same predicate, inverted condition (see
              # _build_withheld_candidates_ctes). Only the delete/overwrite path
              # can withhold; in `either` mode nothing is withheld, so the
              # diagnostic is skipped and the count is 0 by construction. It
              # reports both lock modes in one query (object_lock_mode is a
              # column) and never gates eligibility; it is purely informational
              # (see README "Timestamp ties fail closed").
              withheld_count_hash = None
              if release_mode != 'either':
                  withheld_count_sql = _build_withheld_candidates_count_query(
                      hive_dt, table_name,
                  )
                  withheld_count_hash = hashlib.sha256(
                      withheld_count_sql.encode()
                  ).hexdigest()
                  count_query_ids['_WITHHELD'] = _start_query(
                      athena, withheld_count_sql, db_name, workgroup,
                      solution_bucket, dt, '_WITHHELD', 'count',
                  )

              _wait_for_queries(athena, count_query_ids, deadline, 'count')
              row_counts = {
                  mode: _read_count(athena, count_query_ids[mode])
                  for mode in modes
              }
              withheld_candidate_count = 0
              if '_WITHHELD' in count_query_ids:
                  withheld_candidate_count = _read_count(
                      athena, count_query_ids['_WITHHELD']
                  )

              # Only non-empty modes need an UNLOAD manifest. Count queries and
              # UNLOAD queries share the exact candidate CTE, so the threshold count
              # and manifest selection cannot drift within this implementation.
              unload_query_ids = {}
              for mode in modes:
                  if row_counts[mode] == 0:
                      continue
                  output_prefix = (
                      f's3://{solution_bucket}/manifests/parts/{sequencer}/{mode}/'
                  )
                  sql = _build_query(
                      mode, hive_dt, output_prefix, solution_bucket, target_bucket,
                      release_mode, table_name, db_name,
                      previous_manifest_table,
                  )
                  unload_query_ids[mode] = _start_query(
                      athena, sql, db_name, workgroup, solution_bucket,
                      dt, mode, 'unload',
                  )

              if withheld_candidate_count > 0:
                  withheld_output_prefix = (
                      f's3://{solution_bucket}/manifests/parts/{sequencer}/_WITHHELD/'
                  )
                  withheld_unload_sql = _build_withheld_candidates_query(
                      hive_dt, withheld_output_prefix, table_name,
                  )
                  unload_query_ids['_WITHHELD'] = _start_query(
                      athena, withheld_unload_sql, db_name, workgroup,
                      solution_bucket, dt, '_WITHHELD', 'unload',
                  )

              _wait_for_queries(athena, unload_query_ids, deadline, 'unload')

              # Any failed/cancelled/timed-out query raises before this point, causing
              # the asynchronous invocation to be retried and eventually sent to the
              # DLQ. Never convert query failure into a successful zero-row run.
              result = {
                  'run_id': sequencer,
                  'dt': dt,
                  'target_bucket': target_bucket,
                  'inventory_id': inventory_id,
                  'modes_succeeded': modes,
                  'row_counts': row_counts,
                  'withheld_candidate_count': withheld_candidate_count,
                  'withheld_manifest_written': '_WITHHELD' in unload_query_ids,
                  'query_execution_ids': unload_query_ids,
                  'count_query_execution_ids': count_query_ids,
                  'count_query_hashes': count_query_hashes,
                  'withheld_count_hash': withheld_count_hash,
              }

              print(json.dumps({
                  'event': 'startquery_complete',
                  'dt': dt,
                  'run_id': sequencer,
                  'row_counts': row_counts,
                  'withheld_candidate_count': withheld_candidate_count,
                  'modes_succeeded': modes,
              }))
              s3.put_object(
                  Bucket=solution_bucket,
                  Key=f'manifests/parts/{sequencer}/_query_complete.json',
                  Body=json.dumps(result),
                  ContentType='application/json',
              )
              return result


          def _to_hive_dt(dt):
              """Convert the manifest-path dt (YYYY-MM-DDThh-mmZ, from the S3 event
              key that triggers this Lambda) to the format S3 Inventory's
              hive/dt=.../ symlink-manifest folder actually uses
              (YYYY-MM-DD-hh-mm, dashes only, no T/Z) -- confirmed these are two
              genuinely different strings for the same delivery against a real S3
              Inventory delivery, not just a cosmetic reformat. GlueTable's
              partition projection (projection.dt.format='yyyy-MM-dd-HH-mm')
              expects this second format.

              dt has already passed _DT_PATTERN validation by the time this is
              called, so this is a straight character substitution, not a parse
              that can fail on unexpected input.
              """
              return dt.replace('T', '-').rstrip('Z')


          def _parse_file_schema(file_schema):
              """Extract the column names from a manifest.json fileSchema string.

              Returns a set of names, or an empty set if nothing parsed.
              """
              return {
                  name for _type, name
                  in _PARQUET_FIELD_PATTERN.findall(file_schema)
              }


          def _verify_inventory_schema(s3, solution_bucket, manifest_key):
              """Fail loudly when a delivery lacks a column the eligibility SQL reads.

              Athena returns NULL -- not an error -- for a Glue-declared column that
              the underlying Parquet file does not contain, so an inventory schema
              that has drifted away from GlueTable's declarations produces a
              silently empty eligible set instead of a failure. Every caller of the
              eligibility SQL depends on this check having run first; see
              _REQUIRED_INVENTORY_COLUMNS for the full rationale.

              Raises RuntimeError on any condition that would make the eligibility
              result untrustworthy: an unreadable or malformed manifest, a
              non-Parquet delivery, an unparseable fileSchema, or a missing required
              column. Never downgrades a mismatch to a warning.
              """
              body = s3.get_object(
                  Bucket=solution_bucket, Key=manifest_key
              )['Body'].read()
              try:
                  manifest = json.loads(body)
              except ValueError as exc:
                  raise RuntimeError(
                      f"Inventory manifest '{manifest_key}' is not valid JSON: {exc}"
                  ) from exc

              file_format = manifest.get('fileFormat')
              if file_format != 'Parquet':
                  raise RuntimeError(
                      f"Inventory delivery '{manifest_key}' has fileFormat "
                      f"{file_format!r}, expected 'Parquet'. GlueTable reads Parquet "
                      "via ParquetHiveSerDe, so no query result from this delivery "
                      "would be trustworthy."
                  )

              file_schema = manifest.get('fileSchema') or ''
              delivered = _parse_file_schema(file_schema)
              if not delivered:
                  raise RuntimeError(
                      f"Could not parse any column names from the fileSchema of "
                      f"inventory delivery '{manifest_key}'. Refusing to query a "
                      "delivery whose schema cannot be verified, because a missing "
                      "column would yield a silently empty eligible set. "
                      f"fileSchema was: {file_schema[:500]!r}"
                  )

              missing_required = sorted(_REQUIRED_INVENTORY_COLUMNS - delivered)
              missing_optional = sorted(_OPTIONAL_INVENTORY_COLUMNS - delivered)
              unexpected = sorted(
                  delivered
                  - _REQUIRED_INVENTORY_COLUMNS
                  - _OPTIONAL_INVENTORY_COLUMNS
              )

              print(json.dumps({
                  'event': 'inventory_schema_checked',
                  'manifest_key': manifest_key,
                  'delivered_columns': sorted(delivered),
                  'missing_required': missing_required,
                  # Declared by GlueTable but unused by any query -- informational.
                  'missing_optional': missing_optional,
                  # Delivered but not declared by GlueTable, and therefore invisible
                  # to Athena. An event-hold column arriving under a name this
                  # solution does not declare would surface here.
                  'undeclared_columns': unexpected,
              }))

              if missing_required:
                  raise RuntimeError(
                      "S3 Inventory delivery is missing "
                      f"{len(missing_required)} column(s) the eligibility query "
                      f"reads: {', '.join(missing_required)}. Delivered columns: "
                      f"{', '.join(sorted(delivered)) or '(none)'}. Athena would "
                      "return NULL for each missing column rather than failing, so "
                      "this run would have reported 0 eligible versions and "
                      "succeeded. Failing instead. Check that the inventory "
                      "configuration requests the matching OptionalFields and that "
                      "the Glue table's column names match what S3 Inventory "
                      f"delivers (manifest: {manifest_key})."
                  )


          def _start_query(
              athena, sql, database, workgroup, solution_bucket,
              dt, mode, phase,
          ):
              """Start an idempotent query whose token changes when its SQL changes."""
              sql_hash = hashlib.sha256(sql.encode()).hexdigest()
              token = hashlib.sha256(
                  f'{solution_bucket}/{dt}/{mode}/{phase}/{sql_hash}'.encode()
              ).hexdigest()
              response = athena.start_query_execution(
                  QueryString=sql,
                  QueryExecutionContext={'Database': database},
                  WorkGroup=workgroup,
                  ClientRequestToken=token,
              )
              return response['QueryExecutionId']


          def _wait_for_queries(athena, query_ids, deadline, phase):
              """Wait for all queries or raise so a partial/failed run cannot advance."""
              pending = set(query_ids)
              failures = {}
              while pending and time.time() < deadline:
                  time.sleep(5)
                  for mode in list(pending):
                      response = athena.get_query_execution(
                          QueryExecutionId=query_ids[mode]
                      )
                      status = response['QueryExecution']['Status']
                      state = status['State']
                      if state == 'SUCCEEDED':
                          pending.discard(mode)
                      elif state in ('FAILED', 'CANCELLED'):
                          failures[mode] = status.get('StateChangeReason', state)
                          pending.discard(mode)

              for mode in pending:
                  failures[mode] = 'TIMEOUT'

              if failures:
                  print(json.dumps({
                      'event': 'athena_query_batch_failed',
                      'phase': phase,
                      'failed_modes': sorted(failures),
                      'failures': failures,
                  }))
                  raise RuntimeError(
                      f"Athena {phase} query failure: {json.dumps(failures)}"
                  )


          def _read_count(athena, query_execution_id):
              """Read and strictly validate the single COUNT(*) result row."""
              response = athena.get_query_results(
                  QueryExecutionId=query_execution_id,
                  MaxResults=2,
              )
              rows = response.get('ResultSet', {}).get('Rows', [])
              if len(rows) != 2:
                  raise ValueError(
                      f"Count query {query_execution_id} returned {len(rows)} rows; "
                      "expected one header and one data row"
                  )
              data = rows[1].get('Data', [])
              raw_count = data[0].get('VarCharValue') if data else None
              if raw_count is None or not raw_count.isdigit():
                  raise ValueError(
                      f"Count query {query_execution_id} returned invalid count "
                      f"{raw_count!r}"
                  )
              return int(raw_count)


          def _build_superseder_ctes(dt, glue_table):
              """Build the shared per-candidate superseder-classification CTEs.

              This is THE tie-ambiguity predicate: the eligibility CTEs
              (_build_candidate_ctes, delete/overwrite path) and the withheld-
              candidates diagnostic (_build_withheld_candidates_ctes) both compose
              these CTEs, so what is withheld and what is reported cannot drift.

              S3 Inventory has no sub-second chronological tiebreaker, but
              is_latest does carry ordering information: the current version is
              always LAST in its key's chain. Rather than guessing an order among
              timestamp-tied versions, classify each candidate C (noncurrent,
              hold=ON, data version -- a delete marker can never carry an event
              hold) by the SET of versions its immediate superseder could be:

                possible_superseders(C) =
                    every other row at C's (key, last_modified_date)
                      -- a same-timestamp noncurrent peer may sit on either side
                      -- of C; a same-timestamp CURRENT row sorts last, so it
                      -- supersedes C only if no noncurrent peer does, but it is
                      -- still a possibility and must be in the set
                  UNION
                    the possibly-first rows at the key's next-greater timestamp
                      -- the noncurrent rows of that group; or, if the group is
                      -- only the current version, that current version

              If every possible superseder agrees on is_delete_marker
              (superseder_kinds = 1), C's delete-vs-overwrite classification is
              determined regardless of the unknowable order. Only genuine
              disagreement -- a data version AND a delete marker both possible --
              withholds C (superseder_kinds > 1). A candidate with NO possible
              superseder (superseder_class row absent) cannot be classified and is
              not eligible, but it is not "withheld by ambiguity" either.

              Returns CTE text WITHOUT a leading WITH so callers can compose it.
              """
              return f"""inv AS (
              SELECT key, version_id, is_latest, is_delete_marker,
                     object_lock_event_hold_status, object_lock_mode, last_modified_date
              FROM {glue_table}
              WHERE dt = '{dt}'
            ),
            ts_order AS (
              SELECT key, last_modified_date,
                     LEAD(last_modified_date) OVER (
                       PARTITION BY key ORDER BY last_modified_date ASC
                     ) AS next_lmd
              FROM (SELECT DISTINCT key, last_modified_date FROM inv)
            ),
            group_noncurrent AS (
              SELECT key, last_modified_date,
                     MAX(CASE WHEN is_latest = false THEN 1 ELSE 0 END) AS has_nc
              FROM inv
              GROUP BY key, last_modified_date
            ),
            candidate_base AS (
              SELECT key, version_id, object_lock_mode, last_modified_date
              FROM inv
              WHERE is_latest = false
                AND is_delete_marker = false
                AND object_lock_event_hold_status = 'ON'
            ),
            possible_superseders AS (
              SELECT c.key, c.version_id,
                     p.is_delete_marker AS superseder_is_delete_marker,
                     CASE WHEN p.is_latest = false THEN 1 ELSE 0 END
                       AS via_tied_noncurrent_peer
              FROM candidate_base c
              JOIN inv p
                ON p.key = c.key
               AND p.last_modified_date = c.last_modified_date
               AND p.version_id <> c.version_id
              UNION ALL
              SELECT c.key, c.version_id,
                     s.is_delete_marker AS superseder_is_delete_marker,
                     0 AS via_tied_noncurrent_peer
              FROM candidate_base c
              JOIN ts_order t
                ON t.key = c.key AND t.last_modified_date = c.last_modified_date
              JOIN inv s
                ON s.key = c.key AND s.last_modified_date = t.next_lmd
              JOIN group_noncurrent g
                ON g.key = s.key AND g.last_modified_date = s.last_modified_date
              WHERE s.is_latest = false OR g.has_nc = 0
            ),
            superseder_class AS (
              SELECT key, version_id,
                     COUNT(DISTINCT superseder_is_delete_marker) AS superseder_kinds,
                     MIN(superseder_is_delete_marker) AS superseder_is_delete_marker,
                     MAX(via_tied_noncurrent_peer) AS has_tied_noncurrent_peer
              FROM possible_superseders
              GROUP BY key, version_id
            )"""


          def _build_candidate_ctes(
              mode, dt, release_mode, glue_table,
              previous_manifest_table,
          ):
              """Build the shared eligibility CTEs used by COUNT and UNLOAD.

              `either` mode only needs is_latest='false' to establish noncurrency
              -- S3 ensures at most one is_latest='true' entry (version or
              delete marker) per key -- so it needs no superseder lookup and no
              tie handling at all: it is always the fast path, and nothing is ever
              withheld (the withheld-candidates diagnostic is skipped for it).

              `delete`/`overwrite` must additionally classify HOW each candidate
              was superseded (delete marker vs data version). That classification
              comes from the shared possible-superseders predicate (see
              _build_superseder_ctes): a candidate is eligible when its possible
              superseders unanimously agree on is_delete_marker
              (superseder_kinds = 1) AND that unanimous value matches the release
              mode; it is withheld when they disagree (superseder_kinds > 1).

              Every path excludes candidates already present in previous_manifest_table
              -- the manifest CreateJob most recently submitted a non-suspended job
              for, per mode. This is a one-run-back dedup against re-selecting versions
              whose release may already be in flight (e.g. DAILY inventory delivery lag
              exceeding the DetectionSchedule interval) or already succeeded (e.g. a
              stale withheld manifest re-evaluated after SafetyThreshold is raised).
              previous_manifest_table is only ever populated after a job that actually
              runs (ReportOnly=false, under SafetyThreshold), so this is a no-op in
              ReportOnly mode and does not suppress anything a report-only run would
              otherwise show. previous_manifest keys are url_encode()'d the same way
              the manifest UNLOAD encodes them (see _build_query), so the join compares
              like with like.

              That last sentence holds only because PreviousManifestTable declares all
              three of the manifest CSV's columns (bucket, key, version_id). Its SerDe
              maps fields to columns by position, so a column list missing `bucket`
              shifts every field left and this join then matches nothing at all,
              silently. Read the comment on that table's Columns before changing either
              end of this comparison.
              """
              previous_manifest_filter = f"""
              LEFT JOIN (
                SELECT key, version_id FROM {previous_manifest_table}
                WHERE mode = '{mode}'
              ) pm ON pm.key = url_encode(c.key) AND pm.version_id = c.version_id"""

              if release_mode == 'either':
                  return f"""WITH candidates AS (
              SELECT c.key, c.version_id
              FROM {glue_table} c{previous_manifest_filter}
              WHERE c.dt = '{dt}'
                AND c.is_latest = false
                AND c.is_delete_marker = false
                AND c.object_lock_event_hold_status = 'ON'
                AND c.object_lock_mode = '{mode}'
                AND pm.version_id IS NULL
            )"""

              if release_mode == 'delete':
                  mode_filter = "AND sc.superseder_is_delete_marker = true"
              else:  # overwrite
                  mode_filter = "AND sc.superseder_is_delete_marker = false"

              superseder_ctes = _build_superseder_ctes(dt, glue_table)
              return f"""WITH {superseder_ctes},
            candidates AS (
              SELECT c.key, c.version_id
              FROM candidate_base c
              JOIN superseder_class sc
                ON sc.key = c.key AND sc.version_id = c.version_id{previous_manifest_filter}
              WHERE c.object_lock_mode = '{mode}'
                AND sc.superseder_kinds = 1
                AND pm.version_id IS NULL
                {mode_filter}
            )"""


          def _build_count_query(
              mode, dt, target_bucket, release_mode,
              glue_table, previous_manifest_table,
          ):
              """Build the authoritative pre-job eligible-row count query."""
              ctes = _build_candidate_ctes(
                  mode, dt, release_mode, glue_table,
                  previous_manifest_table,
              )
              return f"""{ctes}
            SELECT COUNT(*) AS eligible_count
            FROM candidates"""


          def _build_query(
              mode, dt, output_prefix, solution_bucket, target_bucket,
              release_mode, glue_table, glue_database,
              previous_manifest_table,
          ):
              """Build the manifest UNLOAD from the shared eligibility CTEs."""
              ctes = _build_candidate_ctes(
                  mode, dt, release_mode, glue_table,
                  previous_manifest_table,
              )
              return f"""UNLOAD (
            {ctes}
            SELECT '{target_bucket}' AS bucket, url_encode(key) AS key, version_id
            FROM candidates
          )
          TO '{output_prefix}'
          WITH (format='TEXTFILE', field_delimiter=',', compression='NONE')"""


          def _build_withheld_candidates_ctes(dt, glue_table):
              """Build the diagnostic CTEs listing candidates withheld by ambiguity.

              Reports exactly the candidates the delete/overwrite eligibility path
              withholds: composed from the SAME possible-superseders predicate
              (_build_superseder_ctes) as _build_candidate_ctes, with the inverted
              condition (superseder_kinds > 1), so withheld and reported cannot
              drift. Union across lock modes: object_lock_mode is carried through
              as a column; ambiguity detection itself is mode-independent, and the
              withheld set is identical for `delete` and `overwrite` (ambiguity is
              "cannot tell delete marker from data version", regardless of which
              one the release mode selects). In `either` mode nothing is ever
              withheld, so the handler skips this diagnostic entirely.

              The reason column distinguishes the two withholding topologies:
              `tied_noncurrent_peer` (the candidate shares its timestamp with
              another noncurrent version) vs `ambiguous_successor_classification`
              (the candidate is not itself tied, but the rows at the next
              timestamp mix a data version and a delete marker).

              No previous_manifest anti-join here, deliberately: the withheld set
              and the pm-deduped set are DISJOINT by construction. A withheld
              candidate produces no job, so it is never written to
              previous_manifest; and a pm-recorded version was released, so its
              hold is OFF next run and it is not a candidate at all.
              """
              superseder_ctes = _build_superseder_ctes(dt, glue_table)
              return f"""WITH {superseder_ctes},
            withheld_candidates AS (
              SELECT c.key, c.version_id, c.object_lock_mode,
                     c.last_modified_date,
                     CASE WHEN sc.has_tied_noncurrent_peer = 1
                          THEN 'tied_noncurrent_peer'
                          ELSE 'ambiguous_successor_classification'
                     END AS reason
              FROM candidate_base c
              JOIN superseder_class sc
                ON sc.key = c.key AND sc.version_id = c.version_id
              WHERE sc.superseder_kinds > 1
            )"""


          def _build_withheld_candidates_count_query(dt, glue_table):
              """Count candidates withheld this run due to timestamp ambiguity."""
              ctes = _build_withheld_candidates_ctes(dt, glue_table)
              return f"""{ctes}
            SELECT COUNT(*) AS withheld_candidate_count
            FROM withheld_candidates"""


          def _build_withheld_candidates_query(dt, output_prefix, glue_table):
              """Build the diagnostic UNLOAD listing ambiguity-withheld candidates."""
              ctes = _build_withheld_candidates_ctes(dt, glue_table)
              return f"""UNLOAD (
            {ctes}
            SELECT url_encode(key) AS key, version_id, object_lock_mode,
                   last_modified_date, reason
            FROM withheld_candidates
          )
          TO '{output_prefix}'
          WITH (format='TEXTFILE', field_delimiter=',', compression='NONE')"""

  # NOTE: S3 Event Notification configuration on SolutionBucket (to trigger this
  # Lambda when inventory/*/manifest.json lands) cannot be set inline due to the
  # circular dependency between the bucket and the Lambda permission. It will be
  # added via a SetupNotifications custom resource in Task 12.

  StartQueryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StartQueryFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt SolutionBucket.Arn

  # ── ManifestMaker Lambda ─────────────────────────────────────────────────────────────
  # Triggered by _query_complete.json landing in manifests/parts/{run_id}/. Reads the
  # trigger metadata to determine which modes succeeded, then concatenates the per-mode
  # TEXTFILE part files into a single headerless CSV manifest per mode using S3 multipart
  # UploadPartCopy (buffering sub-5MB parts up to the 5MB minimum; falling back to
  # PutObject when the total is under 5MB). Writes _manifests_ready.json to
  # manifests/combined/ so the downstream CreateJob Lambda fires. If no modes produced
  # part files, still writes _manifests_ready.json so CreateJob can report a zero-eligible
  # run (Req 5.1, 10.1).

  ManifestMakerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-manifestmaker-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ManifestPartsRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/parts/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
                Condition:
                  StringLike:
                    's3:prefix': 'manifests/parts/*'
        - PolicyName: S3ManifestCombinedWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:AbortMultipartUpload
                Resource:
                  # Scoped to the two key shapes ManifestMaker actually writes under
                  # manifests/combined/, NOT the whole prefix. That prefix also holds
                  # cross-module state owned by other functions --
                  # {run_id}/_createjob_lock.json (CreateJob's idempotency guard),
                  # {run_id}/_active_jobs.json and {run_id}/_completion_sent.json
                  # (JobCompletion) -- and ManifestMaker has no reason to write any of
                  # them. A prefix-wide grant let it pre-create or overwrite a lock,
                  # which blocks job creation or suppresses the completion
                  # notification. The bucket policy exempts ManifestMakerRole from
                  # DenyUnauthorizedPutObject, so this policy is the only thing
                  # scoping it. Both shapes below are also the multipart target
                  # (create/upload_part/upload_part_copy/complete/abort all address
                  # dest_key), so the combine path is unaffected.
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/*/manifest.csv'
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_manifests_ready.json'
                  # Combines the diagnostic withheld-candidates parts (see
                  # manifests/parts/{run_id}/_WITHHELD/, already readable via the
                  # existing S3ManifestPartsRead grant below) into the fixed,
                  # dt-partitioned diagnostics table location.
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/diagnostics/withheld-candidates/*'
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-manifestmaker:*
        - PolicyName: DLQSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn
        - !If
          - HasKMSKey
          - PolicyName: KMSDecryptAndGenerate
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref KMSKeyArn
          - !Ref 'AWS::NoValue'

  ManifestMakerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ManifestMakerLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-manifestmaker'
      Description: >-
        Combines Athena output parts into one Batch Operations manifest per lock mode.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt ManifestMakerRole.Arn
      Timeout: 900
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      Environment:
        Variables:
          SOLUTION_BUCKET: !Ref SolutionBucket
      Code:
        ZipFile: |
          import json
          import os
          import re
          import urllib.parse
          import boto3

          FIVE_MB = 5 * 1024 * 1024

          # S3 Inventory delivery timestamp: YYYY-MM-DDThh-mmZ. Re-validated here
          # even though StartQuery already checks it, because dt reaches this
          # function through a trigger file rather than directly from the S3 event
          # that carried it, and is used to build the diagnostics/withheld-
          # candidates/{dt}/ key path. CreateJob re-validates it again for the same
          # reason.
          _DT_PATTERN = re.compile(
              r'\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}Z\Z'
          )

          # S3 event sequencer / run_id: hex string, validated before use in
          # key paths. Same pattern as StartQuery's _SEQUENCER_PATTERN and
          # JobCompletion's _RUN_ID_PATTERN -- without this, a bucket-policy
          # bypass could inject a trigger file at a path with a non-hex run_id
          # that ManifestMaker accepts but JobCompletion rejects, releasing
          # holds with no notification.
          _RUN_ID_PATTERN = re.compile(r'\A[0-9A-Fa-f]{1,64}\Z')


          def handler(event, context):
              bucket = os.environ['SOLUTION_BUCKET']
              s3 = boto3.client('s3')

              # Parse the S3 event record to get the _query_complete.json key.
              # Key format: manifests/parts/{run_id}/_query_complete.json
              # run_id is the 3rd path segment (index 2).
              record = event['Records'][0]
              raw_key = record['s3']['object']['key']
              key = urllib.parse.unquote_plus(raw_key)
              run_id = key.split('/')[2]

              if not _RUN_ID_PATTERN.match(run_id):
                  raise ValueError(
                      f"Invalid run_id '{run_id}' in key '{key}'; "
                      "expected a hex-encoded S3 event sequencer"
                  )

              # Download and parse the trigger file written by StartQuery.
              obj = s3.get_object(Bucket=bucket, Key=key)
              trigger = json.loads(obj['Body'].read())

              # Validate trigger schema and mode values (Req 5.1, 5.2).
              _validate_trigger(trigger, key, required_fields=[
                  ('run_id', str), ('dt', str), ('target_bucket', str),
                  ('modes_succeeded', list), ('row_counts', dict),
                  ('count_query_execution_ids', dict),
                  ('count_query_hashes', dict),
              ], mode_field='modes_succeeded')

              # Cross-check the trigger's self-reported run_id against the run_id
              # derived from the S3 event key that actually delivered it. Without
              # this, the run_id written into _manifests_ready.json below is taken
              # from the key alone, so CreateJob's equivalent cross-check compares
              # that value against itself and can never fail -- the check exists
              # there but is inert unless the disagreement is caught here, where
              # both values are still independently available.
              if trigger['run_id'] != run_id:
                  raise ValueError(
                      f"Trigger file '{key}' run_id '{trigger['run_id']}' does not "
                      f"match key-derived run_id '{run_id}'"
                  )

              modes_with_manifests = []
              manifest_keys = {}
              row_counts = {}

              for mode in trigger.get('modes_succeeded', []):
                  # Set unconditionally, before the no-manifest branch below --
                  # CreateJob's count-verification step (_verify_count_query)
                  # requires row_counts[mode] for every mode StartQuery counted,
                  # including a genuine zero, to tell "verified zero eligible"
                  # apart from "metadata missing" (they were previously
                  # indistinguishable: a zero-eligible mode never reached this
                  # assignment, so CreateJob saw the same missing-key state as a
                  # real data-integrity problem and withheld it either way).
                  row_counts[mode] = trigger.get('row_counts', {}).get(mode, 0)

                  prefix = f'manifests/parts/{run_id}/{mode}/'
                  part_keys = _list_part_files(s3, bucket, prefix)

                  if not part_keys:
                      # No eligible rows for this mode — skip, write no manifest.
                      continue

                  dest_key = f'manifests/combined/{run_id}/{mode}/manifest.csv'

                  # Head each part to learn its size for strategy selection.
                  sizes = {}
                  total_size = 0
                  for pk in part_keys:
                      sz = s3.head_object(Bucket=bucket, Key=pk)['ContentLength']
                      sizes[pk] = sz
                      total_size += sz

                  if total_size < FIVE_MB or len(part_keys) == 1:
                      # Total < 5MB (or single part): multipart would violate the
                      # 5MB minimum for non-final parts, so download, concatenate,
                      # and PutObject instead.
                      data = b''
                      for pk in part_keys:
                          data += s3.get_object(Bucket=bucket, Key=pk)['Body'].read()
                      s3.put_object(Bucket=bucket, Key=dest_key, Body=data)
                  else:
                      _combine_parts_multipart(s3, bucket, part_keys, sizes, dest_key)

                  modes_with_manifests.append(mode)
                  manifest_keys[mode] = dest_key

              # Combine the diagnostic withheld-candidates parts (if StartQuery wrote
              # any) into the fixed, dt-partitioned diagnostics table location. This
              # is informational only -- it never affects modes_with_manifests, and a
              # failure here would fail the whole invocation (retried, then DLQ'd)
              # rather than silently dropping eligibility results, so it is combined
              # using the same helpers as the per-mode manifests above.
              withheld_candidate_count = trigger.get('withheld_candidate_count', 0)
              dt = trigger.get('dt')
              if trigger.get('withheld_manifest_written'):
                  withheld_prefix = f'manifests/parts/{run_id}/_WITHHELD/'
                  withheld_part_keys = _list_part_files(s3, bucket, withheld_prefix)
                  if withheld_part_keys:
                      # No "dt=" prefix: matches the raw-value convention already
                      # used by the inventory table's injected partition projection
                      # (storage.location.template ends in .../${dt}/, not
                      # .../dt=${dt}/).
                      withheld_dest_key = (
                          f'diagnostics/withheld-candidates/{dt}/manifest.csv'
                      )
                      sizes = {}
                      total_size = 0
                      for pk in withheld_part_keys:
                          sz = s3.head_object(Bucket=bucket, Key=pk)['ContentLength']
                          sizes[pk] = sz
                          total_size += sz

                      if total_size < FIVE_MB or len(withheld_part_keys) == 1:
                          data = b''
                          for pk in withheld_part_keys:
                              data += s3.get_object(
                                  Bucket=bucket, Key=pk
                              )['Body'].read()
                          s3.put_object(
                              Bucket=bucket, Key=withheld_dest_key, Body=data,
                          )
                      else:
                          _combine_parts_multipart(
                              s3, bucket, withheld_part_keys, sizes,
                              withheld_dest_key,
                          )

              # Write _manifests_ready.json even when no modes produced manifests so
              # CreateJob fires and can report a zero-eligible run (Req 5.1).
              result = {
                  'run_id': run_id,
                  'dt': trigger.get('dt'),
                  'target_bucket': trigger.get('target_bucket'),
                  'inventory_id': trigger.get('inventory_id'),
                  'modes_with_manifests': modes_with_manifests,
                  'manifest_keys': manifest_keys,
                  'row_counts': row_counts,
                  'withheld_candidate_count': withheld_candidate_count,
                  'query_execution_ids': trigger.get('query_execution_ids', {}),
                  'count_query_execution_ids': trigger['count_query_execution_ids'],
                  'count_query_hashes': trigger['count_query_hashes'],
              }

              # Audit log: structured record of the ManifestMaker run (Req 6.1).
              print(json.dumps({
                  'event': 'manifestmaker_complete',
                  'run_id': run_id,
                  'dt': trigger.get('dt'),
                  'modes_with_manifests': modes_with_manifests,
                  'manifest_keys': manifest_keys,
                  'row_counts': row_counts,
                  'withheld_candidate_count': withheld_candidate_count,
              }))
              s3.put_object(
                  Bucket=bucket,
                  Key=f'manifests/combined/{run_id}/_manifests_ready.json',
                  Body=json.dumps(result),
                  ContentType='application/json',
              )
              return result


          _ALLOWED_MODES = frozenset(['COMPLIANCE', 'GOVERNANCE'])


          def _validate_trigger(trigger, source_key, required_fields, mode_field):
              """Validate trigger file schema and mode values (Req 5.1, 5.2).

              Raises ValueError on any missing field, wrong type, or disallowed mode.
              """
              for field_name, expected_type in required_fields:
                  value = trigger.get(field_name)
                  if value is None:
                      raise ValueError(
                          f"Trigger file '{source_key}' missing required field "
                          f"'{field_name}'"
                      )
                  if not isinstance(value, expected_type):
                      raise ValueError(
                          f"Trigger file '{source_key}' field '{field_name}' has type "
                          f"{type(value).__name__}, expected {expected_type.__name__}"
                      )
                  # dt reaches the diagnostics/withheld-candidates/{dt}/ key path
                  # below, so a str type check alone does not bound it. Validate the
                  # format, matching what StartQuery and CreateJob both already do.
                  if field_name == 'dt' and not _DT_PATTERN.match(value):
                      raise ValueError(
                          f"Trigger file '{source_key}' has invalid dt '{value}'; "
                          "expected YYYY-MM-DDThh-mmZ"
                      )

              modes = trigger.get(mode_field, [])
              for mode in modes:
                  if mode not in _ALLOWED_MODES:
                      raise ValueError(
                          f"Trigger file '{source_key}' contains disallowed mode "
                          f"'{mode}'; allowed: {sorted(_ALLOWED_MODES)}"
                      )


          def _list_part_files(s3, bucket, prefix):
              """List sorted part file keys under prefix, skipping '_'-prefixed names."""
              part_keys = []
              paginator = s3.get_paginator('list_objects_v2')
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get('Contents', []):
                      name = obj['Key'].split('/')[-1]
                      if not name.startswith('_'):
                          part_keys.append(obj['Key'])
              part_keys.sort()
              return part_keys


          def _combine_parts_multipart(s3, bucket, part_keys, sizes, dest_key):
              """Combine sorted part files into a single object via multipart UploadPartCopy.

              Buffers consecutive sub-5MB parts until the buffer reaches the 5MB
              minimum required for all non-final multipart parts, then flushes by
              downloading the buffered parts and calling upload_part. Single parts
              that are >= 5MB are copied directly via upload_part_copy without
              downloading. The final part may be any size.

              On any exception the multipart upload is aborted before re-raising so
              that incomplete uploads do not linger in the bucket.
              """
              mpu = s3.create_multipart_upload(Bucket=bucket, Key=dest_key)
              upload_id = mpu['UploadId']
              parts = []
              part_num = 1
              buffer_keys = []
              buffer_size = 0

              try:
                  for i, part_key in enumerate(part_keys):
                      size = sizes[part_key]
                      buffer_keys.append(part_key)
                      buffer_size += size
                      is_last = (i == len(part_keys) - 1)

                      if buffer_size >= FIVE_MB or is_last:
                          if len(buffer_keys) == 1 and buffer_size >= FIVE_MB:
                              # Single large part: copy directly via UploadPartCopy.
                              resp = s3.upload_part_copy(
                                  Bucket=bucket,
                                  Key=dest_key,
                                  UploadId=upload_id,
                                  PartNumber=part_num,
                                  CopySource={'Bucket': bucket, 'Key': buffer_keys[0]},
                              )
                              parts.append({
                                  'PartNumber': part_num,
                                  'ETag': resp['CopyPartResult']['ETag'],
                              })
                          else:
                              # Multiple small parts or final flush: download and re-upload.
                              data = b''
                              for bk in buffer_keys:
                                  data += s3.get_object(
                                      Bucket=bucket, Key=bk
                                  )['Body'].read()
                              resp = s3.upload_part(
                                  Bucket=bucket,
                                  Key=dest_key,
                                  UploadId=upload_id,
                                  PartNumber=part_num,
                                  Body=data,
                              )
                              parts.append({
                                  'PartNumber': part_num,
                                  'ETag': resp['ETag'],
                              })
                          part_num += 1
                          buffer_keys = []
                          buffer_size = 0

                  s3.complete_multipart_upload(
                      Bucket=bucket,
                      Key=dest_key,
                      UploadId=upload_id,
                      MultipartUpload={'Parts': parts},
                  )
              except Exception:
                  s3.abort_multipart_upload(
                      Bucket=bucket, Key=dest_key, UploadId=upload_id
                  )
                  raise

  ManifestMakerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ManifestMakerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt SolutionBucket.Arn

  # ── CreateJob Lambda ─────────────────────────────────────────────────────────────────
  # Triggered by _manifests_ready.json landing in manifests/combined/{run_id}/.
  # Verifies each mode's authoritative COUNT(*) query, withholds invalid or
  # over-threshold active modes without creating a job, and creates a native
  # S3PutObjectRetention Batch Operations job for each approved per-mode manifest,
  # then writes SNS/S3 summaries.

  CreateJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-createjob-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3CreateJob
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:CreateJob
                  # CreateJob's Tags parameter (job-created-by, run-id -- see the
                  # create_job call below) requires PutJobTagging in addition to
                  # CreateJob itself; without it CreateJob fails with AccessDenied
                  # ("no identity-based policy allows the s3:PutJobTagging
                  # action"), confirmed against a real deployed stack.
                  - s3:PutJobTagging
                # Batch Operations job APIs authorize against account job ARNs.
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:*:${AWS::AccountId}:job/*
        - PolicyName: PassBatchRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                # Scoped to BatchOperationsRole only — least-privilege (Req 8.3).
                Resource: !GetAtt BatchOperationsRole.Arn
                # Restricts this grant to handing the role to Batch Operations and
                # nothing else, matching the pattern already used on
                # S3TableIntegrationSetupRole's PassRole for logs.amazonaws.com.
                #
                # Note the contrast with the BatchOperationsRole *trust* policy,
                # which deliberately carries no Condition: there, the service is not
                # documented as populating aws:SourceArn/aws:SourceAccount, so a
                # Condition on an absent context key would evaluate false and deny
                # sts:AssumeRole at run time. iam:PassedToService is different --
                # IAM itself populates it on every PassRole request, so this cannot
                # fail closed. Defence in depth: BatchOperationsRole's trust policy
                # already admits only batchoperations.s3.amazonaws.com, so passing it
                # elsewhere would fail at AssumeRole anyway. This removes the
                # dependence on that trust policy staying as it is.
                Condition:
                  StringEquals:
                    'iam:PassedToService': 'batchoperations.s3.amazonaws.com'
        - PolicyName: S3ManifestAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/athena-results/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_job_summary.json
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_job_summaries/*
                  # Per-run duplicate-invocation lock (IfNoneMatch='*') -- S3
                  # event notifications are at-least-once, so this claims the
                  # run before any Athena verification, create_job, or
                  # sns.publish, so a second delivery for the same run is a
                  # no-op instead of a duplicate notification/job attempt.
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_createjob_lock.json
                  # Written instead of _job_summary.json/SNS when this run created
                  # at least one active (non-suspended) job -- read and eventually
                  # replaced by JobCompletionFunction once every job this run
                  # created reaches a terminal BOPS state (see that resource).
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_active_jobs.json
              # Written (via CopyObject, source manifests/combined/*/{mode}/manifest.csv
              # -- already readable above) only immediately after creating a
              # non-suspended job for that mode, as the "most recently released"
              # pointer StartQuery anti-joins against. Never written for a
              # suspended (ReportOnly=true) or withheld job.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/previous/*'
              # Lets the head_object below tell "manifest is missing" from
              # "cannot read it". S3 returns 404 for a missing object only when
              # the caller also holds s3:ListBucket; without it a missing key
              # comes back 403, so the manifest_not_found withhold branch was
              # unreachable and the run raised into the DLQ instead.
              #
              # Measured 2026-09-02 against a real bucket, three role variants:
              # with this grant a missing key gives 404 for get_object and
              # head_object, without it 403 for both. The s3:prefix condition is
              # kept because the same measurement showed it does not interfere.
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - 'manifests/combined/*'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopic
        - PolicyName: AthenaVerifyCountQuery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: !Sub >-
                  arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AWS::StackName}-wg
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-createjob:*
        - PolicyName: DLQSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn
        - !If
          - HasKMSKey
          - PolicyName: KMSDecryptAndGenerate
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref KMSKeyArn
          - !Ref 'AWS::NoValue'

  CreateJobFunction:
    Type: AWS::Lambda::Function
    DependsOn: CreateJobLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-createjob'
      Description: >-
        Verifies eligibility counts and creates only approved S3 Batch Operations
        (S3PutObjectRetention) jobs for release.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt CreateJobRole.Arn
      Timeout: 300
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      Environment:
        Variables:
          SOLUTION_BUCKET: !Ref SolutionBucket
          REPORT_ONLY: !Ref ReportOnly
          SAFETY_THRESHOLD: !Ref SafetyThreshold
          SNS_TOPIC_ARN: !Ref SNSTopic
          BATCH_OPERATIONS_ROLE_ARN: !GetAtt BatchOperationsRole.Arn
          TARGET_BUCKET: !Ref TargetBucket
          ATHENA_WORKGROUP: !Sub '${AWS::StackName}-wg'
          STACK_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import boto3
          import botocore.session
          from botocore.exceptions import ClientError, ParamValidationError

          # S3 Inventory delivery timestamp: YYYY-MM-DDThh-mmZ. Re-validated here
          # even though StartQuery already checks it, because dt reaches CreateJob
          # via a trigger file that passed through ManifestMaker rather than
          # directly from the S3 event — it must not be trusted as pre-validated.
          _DT_PATTERN = re.compile(
              r'\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}Z\Z'
          )
          _ALLOWED_MODES = frozenset(['COMPLIANCE', 'GOVERNANCE'])

          # Same hex pattern as StartQuery's _SEQUENCER_PATTERN and
          # JobCompletion's _RUN_ID_PATTERN. Without this, CreateJob would
          # accept a non-hex run_id that JobCompletion later rejects,
          # creating an audit-evasion path where holds are released without
          # a completion notification.
          _RUN_ID_PATTERN = re.compile(r'\A[0-9A-Fa-f]{1,64}\Z')

          # The AWS SDK validates call parameters locally, against its own bundled
          # copy of the s3control service model, before it signs the request. A
          # bundled model that does not declare EventHold on the retention shape
          # therefore rejects this solution's create_job call inside the function,
          # and the request never reaches S3. Lambda's managed runtimes supply their
          # own boto3/botocore, and AWS documents that bundled version as varying by
          # runtime version and Region rather than publishing it, so whether a given
          # deployment can make this call is a property of the environment it lands
          # in and not of this template. It is read at run time for that reason.
          #
          # A shape check rather than an SDK version comparison, deliberately. The
          # version number is an indirect signal: interpreting it needs a lookup
          # table of which release first carried the member, that table has to be
          # revised whenever it changes, and a wrong entry either blocks a runtime
          # that would have worked or lets a call through that cannot. Asking the
          # loaded model whether it declares the member answers the same question
          # directly and needs no maintenance.
          _RETENTION_SHAPE = 'S3Retention'


          def _event_hold_capability():
              """Report whether the bundled SDK declares EventHold on retention.

              Returns a dict, logged once per run and carried into the run summary.
              'event_hold_model' is 'native' when the loaded model declares the
              member, 'missing' when it does not, and 'unknown' when the check
              itself could not complete.
              """
              info = {
                  'botocore_version': getattr(
                      botocore, '__version__', 'unknown'
                  ),
              }
              try:
                  model = botocore.session.get_session().get_service_model(
                      's3control'
                  )
                  members = model.shape_for(_RETENTION_SHAPE).members
                  info['event_hold_model'] = (
                      'native' if 'EventHold' in members else 'missing'
                  )
                  info['retention_members'] = sorted(members)
              except Exception as exc:
                  # 'unknown' goes on to attempt create_job instead of withholding.
                  # A check that failed is not evidence that the call would fail,
                  # and the model-introspection methods used above are SDK
                  # internals rather than a supported interface, so this must never
                  # become the thing that stops a run which would have succeeded.
                  # If the bundled model genuinely lacks the member, create_job
                  # raises ParamValidationError and the handler records the same
                  # withheld reason from there.
                  info['event_hold_model'] = 'unknown'
                  info['detail'] = str(exc)[:200]
              return info


          def _verify_count_query(
              athena, query_execution_id, expected_hash, expected_workgroup,
          ):
              """Return COUNT(*) only for the expected successful Athena query."""
              response = athena.get_query_execution(
                  QueryExecutionId=query_execution_id
              )
              execution = response['QueryExecution']
              state = execution['Status']['State']
              if state != 'SUCCEEDED':
                  raise ValueError(
                      f"Count query {query_execution_id} state is {state}, not SUCCEEDED"
                  )
              if execution.get('WorkGroup') != expected_workgroup:
                  raise ValueError(
                      f"Count query {query_execution_id} ran in unexpected workgroup"
                  )
              actual_hash = hashlib.sha256(
                  execution.get('Query', '').encode()
              ).hexdigest()
              if actual_hash != expected_hash:
                  raise ValueError(
                      f"Count query {query_execution_id} SQL hash mismatch"
                  )

              result = athena.get_query_results(
                  QueryExecutionId=query_execution_id,
                  MaxResults=2,
              )
              rows = result.get('ResultSet', {}).get('Rows', [])
              if len(rows) != 2:
                  raise ValueError(
                      f"Count query {query_execution_id} returned {len(rows)} rows"
                  )
              data = rows[1].get('Data', [])
              raw_count = data[0].get('VarCharValue') if data else None
              if raw_count is None or not raw_count.isdigit():
                  raise ValueError(
                      f"Count query {query_execution_id} returned invalid count "
                      f"{raw_count!r}"
                  )
              return int(raw_count)


          def _build_human_summary(
              run_id, dt, target_bucket, report_only, verified_counts,
              created_jobs, suspended_jobs, withheld_modes, skipped_modes,
          ):
              """Plain-English recap of this run, for the top of the SNS email /
              JSON summary -- everyone else reads the structured fields below it.
              """
              lines = [
                  f"Run {run_id} against {target_bucket} (inventory {dt}), "
                  f"{'report-only' if report_only else 'active'} mode."
              ]

              for mode, job_id in sorted(created_jobs.items()):
                  count = verified_counts.get(mode, 0)
                  lines.append(
                      f"{mode}: released {count} event hold"
                      f"{'s' if count != 1 else ''} (job {job_id})."
                  )
              for mode, job_id in sorted(suspended_jobs.items()):
                  count = verified_counts.get(mode, 0)
                  lines.append(
                      f"{mode}: found {count} eligible version"
                      f"{'s' if count != 1 else ''}, job {job_id} created "
                      "suspended for review (report-only) -- nothing released."
                  )
              for mode in sorted(skipped_modes):
                  lines.append(f"{mode}: no eligible versions this run.")
              for mode, detail in sorted(withheld_modes.items()):
                  reason = detail.get('reason', 'unknown')
                  if reason == 'safety_threshold_exceeded':
                      lines.append(
                          f"{mode}: WITHHELD -- {detail.get('eligible_count')} "
                          f"eligible versions exceeds SafetyThreshold "
                          f"({detail.get('safety_threshold')}); no job created, "
                          "review and re-run to proceed."
                      )
                  elif reason == 'count_mismatch':
                      lines.append(
                          f"{mode}: WITHHELD -- eligibility count mismatch "
                          f"(Athena {detail.get('athena_count')} vs manifest "
                          f"{detail.get('trigger_count')}); no job created."
                      )
                  elif reason == 'event_hold_unsupported_by_runtime':
                      lines.append(
                          f"{mode}: WITHHELD -- the AWS SDK bundled in this "
                          f"Lambda runtime (botocore "
                          f"{detail.get('botocore_version', 'unknown')}) does "
                          "not accept the EventHold parameter, so no Batch "
                          "Operations job was created. Nothing was released and "
                          "nothing was lost: these versions stay eligible, and "
                          "the next run releases them once the runtime's bundled "
                          "SDK carries the parameter. See OPERATIONS.md, "
                          "\"Withheld: runtime SDK does not support EventHold\"."
                      )
                  elif reason == 'create_job_failed':
                      lines.append(
                          f"{mode}: WITHHELD -- Batch Operations job creation "
                          f"failed ({detail.get('detail', 'see logs')})."
                      )
                  else:
                      lines.append(f"{mode}: WITHHELD -- {reason}.")

              if len(lines) == 1:
                  lines.append("No modes were evaluated for this run.")
              return ' '.join(lines)


          # SNS Subject lines are ASCII-only and capped at 100 characters. The
          # bucket name is the last field and the only variable-length free text in
          # the line, so it is what overflows -- elide its middle rather than let
          # the caller's [:100] slice amputate it, because both ends of a bucket
          # name carry identifying information (environment prefix, Region suffix).
          _SUBJECT_MAX = 100
          _SUBJECT_STEM = 'Auto Remove Event Hold: '
          # Room always reserved for the bucket name. Naming the bucket is the whole
          # point of the line, and an elided-middle name still identifies a stack, so
          # the outcome gives up trailing clauses before the bucket gives up
          # characters.
          _SUBJECT_MIN_BUCKET = 20


          def _fit_subject(outcome, bucket, tag=''):
              """Assemble '{stem}{outcome}{tag} - {bucket}' inside the 100-character
              limit. The bucket name's middle is elided if the line would overflow;
              only if fewer than _SUBJECT_MIN_BUCKET characters of bucket would
              survive does the outcome drop whole trailing clauses (never half a
              printed number). Everything appears untruncated in the message body.
              """
              room = _SUBJECT_MAX - len(_SUBJECT_STEM) - len(tag) - len(' - ')
              reserved = min(len(bucket), _SUBJECT_MIN_BUCKET)
              if len(outcome) > room - reserved:
                  clauses = outcome.split(', ')
                  kept = [clauses[0]]
                  while len(kept) < len(clauses) and (
                      len(', '.join(kept + [clauses[len(kept)]])) + 3
                      <= room - reserved
                  ):
                      kept.append(clauses[len(kept)])
                  outcome = ', '.join(kept)
                  if len(kept) < len(clauses):
                      outcome += '...'
                  # Guards the case where even the first clause overruns the room.
                  outcome = outcome[:room - reserved]

              head = f'{_SUBJECT_STEM}{outcome}{tag} - '
              budget = _SUBJECT_MAX - len(head)
              if len(bucket) > budget:
                  keep = max(budget - 3, 2)
                  bucket = (
                      f'{bucket[:(keep + 1) // 2]}...{bucket[-(keep // 2):]}'
                  )
              return f'{head}{bucket}'


          def _build_subject(
              target_bucket, report_only, verified_counts, suspended_jobs,
              withheld_modes, skipped_modes,
          ):
              """SNS Subject line: lead with the outcome and the eligible version
              count so the mail is triageable from an inbox list without opening it,
              and name the Target_Bucket last so runs from different stacks are
              distinguishable at a glance. run_id is deliberately absent -- it is the
              first thing in the message body, and an opaque hex sequencer earns no
              space in a 100-character subject.

              This function is only reached when no ACTIVE job was created (a
              report-only run, a withheld run, or nothing eligible). Every real
              release is announced by JobCompletionFunction's
              _build_completion_subject instead, because the handler returns early
              and defers notification whenever it creates an active job.
              """
              counted = []
              if suspended_jobs:
                  counted.append((len(suspended_jobs), 'pending'))
              if withheld_modes:
                  counted.append((len(withheld_modes), 'withheld'))

              if counted:
                  first_count, first_label = counted[0]
                  parts = [
                      f"{first_count} job{'s' if first_count != 1 else ''} "
                      f"{first_label}"
                  ]
                  parts += [f'{count} {label}' for count, label in counted[1:]]
                  # verified_counts holds the Athena-verified eligible version count
                  # per mode. It is populated for every suspended mode and for modes
                  # withheld on SafetyThreshold, but not for modes withheld before
                  # verification completed (count_mismatch and friends) -- those
                  # contribute 0 and the count is omitted entirely if none is known,
                  # rather than asserting a number the run never established.
                  versions = sum(
                      verified_counts.get(mode, 0)
                      for mode in list(suspended_jobs) + list(withheld_modes)
                  )
                  if versions:
                      parts.append(
                          f"{versions:,} version{'s' if versions != 1 else ''}"
                      )
                  outcome = ', '.join(parts)
              elif skipped_modes:
                  outcome = 'nothing eligible'
              else:
                  outcome = 'no modes evaluated'

              tag = ' [Report-Only]' if report_only else ''
              return _fit_subject(outcome, target_bucket, tag)


          def handler(event, context):
              solution_bucket = os.environ['SOLUTION_BUCKET']
              report_only = os.environ['REPORT_ONLY'].lower() == 'true'
              safety_threshold = int(os.environ['SAFETY_THRESHOLD'])
              sns_topic_arn = os.environ['SNS_TOPIC_ARN']
              batch_operations_role_arn = os.environ['BATCH_OPERATIONS_ROLE_ARN']
              target_bucket_env = os.environ['TARGET_BUCKET']
              stack_name = os.environ['STACK_NAME']

              # Account ID/partition derived from the Lambda function ARN (no STS
              # call needed).
              account_id = context.invoked_function_arn.split(':')[4]
              partition = context.invoked_function_arn.split(':')[1]

              # Parse the S3 event record.
              # Key format: manifests/combined/{run_id}/_manifests_ready.json
              record = event['Records'][0]
              raw_key = record['s3']['object']['key']
              key = urllib.parse.unquote_plus(raw_key)
              run_id = key.split('/')[2]

              if not _RUN_ID_PATTERN.match(run_id):
                  raise ValueError(
                      f"Invalid run_id '{run_id}' in key '{key}'; "
                      "expected a hex-encoded S3 event sequencer"
                  )

              # Read once per run, ahead of the per-mode loop, and logged whatever
              # the answer is. A run that creates jobs normally still records which
              # SDK it used, so a later failure can be told apart from a runtime
              # that changed underneath the stack.
              capability = _event_hold_capability()
              print(json.dumps({
                  'event': 'createjob_event_hold_capability',
                  'run_id': run_id,
                  **capability,
              }))

              s3 = boto3.client('s3')
              s3control = boto3.client('s3control')
              sns = boto3.client('sns')
              athena = boto3.client('athena')

              # S3 event notifications are at-least-once, not exactly-once -- this
              # Lambda can and does get invoked more than once for the same
              # _manifests_ready.json write (confirmed against a real deployed
              # stack: two invocations, same run_id, both completing successfully).
              # create_job's ClientRequestToken already makes the BOPS job itself
              # idempotent against this, but nothing previously stopped a second
              # invocation from running the whole handler again and publishing a
              # second, duplicate SNS notification for the same run. Claim the run
              # via a conditional PutObject (IfNoneMatch='*') before doing any
              # other work: only the first invocation to reach this line succeeds;
              # every subsequent invocation for the same run_id gets
              # PreconditionFailed and returns immediately, before Athena
              # verification, create_job, or sns.publish run again.
              try:
                  s3.put_object(
                      Bucket=solution_bucket,
                      Key=f'manifests/combined/{run_id}/_createjob_lock.json',
                      Body=json.dumps({
                          'run_id': run_id,
                          'request_id': context.aws_request_id,
                      }),
                      ContentType='application/json',
                      IfNoneMatch='*',
                  )
              except ClientError as exc:
                  if exc.response['Error']['Code'] == 'PreconditionFailed':
                      print(json.dumps({
                          'event': 'createjob_duplicate_invocation_skipped',
                          'run_id': run_id,
                          'request_id': context.aws_request_id,
                      }))
                      return {'run_id': run_id, 'skipped': 'duplicate_invocation'}
                  raise

              # Download and parse the trigger file written by ManifestMaker.
              obj = s3.get_object(Bucket=solution_bucket, Key=key)
              trigger = json.loads(obj['Body'].read())

              # Validate trigger schema and mode values (Req 5.1, 5.2).
              for field_name, expected_type in [
                  ('run_id', str), ('dt', str), ('target_bucket', str),
                  ('modes_with_manifests', list), ('manifest_keys', dict),
                  ('row_counts', dict), ('count_query_execution_ids', dict),
                  ('count_query_hashes', dict),
              ]:
                  value = trigger.get(field_name)
                  if value is None:
                      raise ValueError(
                          f"Trigger file '{key}' missing required field '{field_name}'"
                      )
                  if not isinstance(value, expected_type):
                      raise ValueError(
                          f"Trigger file '{key}' field '{field_name}' has type "
                          f"{type(value).__name__}, expected {expected_type.__name__}"
                      )
              for mode in trigger.get('modes_with_manifests', []):
                  if mode not in _ALLOWED_MODES:
                      raise ValueError(
                          f"Trigger file '{key}' contains disallowed mode '{mode}'; "
                          f"allowed: {sorted(_ALLOWED_MODES)}"
                      )

              # Re-validate dt's format (defense in depth — see _DT_PATTERN comment
              # above) and cross-check the trigger's self-reported run_id against
              # the run_id derived from the S3 event key that actually triggered
              # this invocation. A mismatch means the trigger file's content
              # disagrees with the path it was delivered to, which should never
              # happen for a legitimate ManifestMaker-written file.
              if not _DT_PATTERN.match(trigger.get('dt', '')):
                  raise ValueError(
                      f"Trigger file '{key}' has invalid dt "
                      f"'{trigger.get('dt', '')}'; expected YYYY-MM-DDThh-mmZ"
                  )
              if trigger.get('run_id') != run_id:
                  raise ValueError(
                      f"Trigger file '{key}' run_id '{trigger.get('run_id')}' does "
                      f"not match key-derived run_id '{run_id}'"
                  )
              if trigger.get('target_bucket') != target_bucket_env:
                  raise ValueError(
                      f"Trigger file '{key}' target_bucket "
                      f"'{trigger.get('target_bucket')}' does not match the "
                      f"deployed TargetBucket '{target_bucket_env}'"
                  )

              created_jobs = {}
              suspended_jobs = {}
              skipped_modes = []
              withheld_modes = {}
              verified_counts = {}

              # Verify every mode's dedicated COUNT(*) query before considering any
              # Batch Operations job. Missing, stale, failed, or mismatched count data
              # withholds that mode without incurring job-creation charges.
              for mode in sorted(_ALLOWED_MODES):
                  query_id = trigger['count_query_execution_ids'].get(mode)
                  expected_hash = trigger['count_query_hashes'].get(mode)
                  trigger_count = trigger['row_counts'].get(mode)
                  if (
                      not query_id or not expected_hash
                      or not isinstance(trigger_count, int) or trigger_count < 0
                  ):
                      withheld_modes[mode] = {
                          'reason': 'missing_or_invalid_count_metadata'
                      }
                      continue

                  try:
                      row_count = _verify_count_query(
                          athena, query_id, expected_hash,
                          os.environ['ATHENA_WORKGROUP'],
                      )
                  except Exception as exc:
                      withheld_modes[mode] = {
                          'reason': 'count_query_verification_failed',
                          'detail': str(exc),
                      }
                      continue

                  if trigger_count != row_count:
                      withheld_modes[mode] = {
                          'reason': 'count_mismatch',
                          'athena_count': row_count,
                          'trigger_count': trigger_count,
                      }
                      continue

                  verified_counts[mode] = row_count
                  if row_count == 0:
                      skipped_modes.append(mode)
                      continue

                  # In active mode, exceeding SafetyThreshold means no job is created.
                  # This is both fail-closed and avoids per-object Batch Operations
                  # charges that are incurred when a job is created.
                  if not report_only and row_count > safety_threshold:
                      withheld_modes[mode] = {
                          'reason': 'safety_threshold_exceeded',
                          'eligible_count': row_count,
                          'safety_threshold': safety_threshold,
                      }
                      print(json.dumps({
                          'event': 'createjob_withheld',
                          'run_id': run_id,
                          'mode': mode,
                          **withheld_modes[mode],
                      }))
                      continue

                  if mode not in trigger['modes_with_manifests']:
                      withheld_modes[mode] = {
                          'reason': 'positive_count_without_manifest'
                      }
                      continue

                  manifest_key = trigger['manifest_keys'].get(mode)
                  expected_prefix = f'manifests/combined/{run_id}/{mode}/'
                  if (
                      not manifest_key
                      or not manifest_key.startswith(expected_prefix)
                      or '..' in manifest_key
                  ):
                      withheld_modes[mode] = {
                          'reason': 'invalid_manifest_key',
                          'manifest_key': manifest_key,
                      }
                      continue

                  try:
                      head = s3.head_object(
                          Bucket=solution_bucket,
                          Key=manifest_key,
                      )
                      etag = head['ETag']
                  except ClientError as exc:
                      err_code = exc.response['Error']['Code']
                      if err_code in ('404', 'NoSuchKey'):
                          withheld_modes[mode] = {
                              'reason': 'manifest_not_found'
                          }
                          continue
                      raise

                  # ConfirmationRequired=true creates the job SUSPENDED -- it never
                  # executes unless manually confirmed in the console/API. This is
                  # the ReportOnly preview: inspect the suspended job plus the
                  # eligibility manifest for what WOULD be released. Confirmed jobs
                  # never happen automatically, so a suspended job produces no
                  # completion report to read here.
                  confirmation_required = report_only
                  dt = trigger['dt']
                  client_request_token = hashlib.sha256(
                      f'{solution_bucket}/{run_id}/{dt}/{mode}'.encode()
                  ).hexdigest()

                  # Withhold rather than call create_job when the bundled model is
                  # known not to declare EventHold. The call would be rejected
                  # inside this function either way; stopping here records why in
                  # terms a reader can act on, instead of leaving a validation
                  # message to be interpreted. Counts have already been verified
                  # above, so a withheld run still reports what it found: the
                  # outcome reads like a report-only run, without a job to inspect.
                  if capability['event_hold_model'] == 'missing':
                      withheld_modes[mode] = {
                          'reason': 'event_hold_unsupported_by_runtime',
                          'botocore_version': capability['botocore_version'],
                          'retention_members': capability.get(
                              'retention_members', []
                          ),
                      }
                      print(json.dumps({
                          'event': 'createjob_event_hold_unsupported',
                          'run_id': run_id,
                          'mode': mode,
                          **capability,
                      }))
                      continue

                  try:
                      response = s3control.create_job(
                          AccountId=account_id,
                          ClientRequestToken=client_request_token,
                          ConfirmationRequired=confirmation_required,
                          Operation={
                              # BypassGovernanceRetention is explicitly False:
                              # releasing an event hold computes retain-until-date
                              # = MAX(existing, release time + EventHoldDuration),
                              # which never shortens protection and therefore never
                              # needs a governance bypass (Req 5.3).
                              'S3PutObjectRetention': {
                                  'BypassGovernanceRetention': False,
                                  'Retention': {
                                      'Mode': mode,
                                      'EventHold': 'OFF',
                                  },
                              }
                          },
                          Report={
                              'Bucket': f'arn:{partition}:s3:::{solution_bucket}',
                              'Format': 'Report_CSV_20180820',
                              'Enabled': True,
                              'Prefix': f'reports/{run_id}/{mode}/',
                              'ReportScope': 'AllTasks',
                          },
                          Manifest={
                              'Spec': {
                                  'Format': 'S3BatchOperations_CSV_20180820',
                                  'Fields': ['Bucket', 'Key', 'VersionId'],
                              },
                              'Location': {
                                  'ObjectArn': (
                                      f'arn:{partition}:s3:::{solution_bucket}/'
                                      f'{manifest_key}'
                                  ),
                                  'ETag': etag,
                              },
                          },
                          Priority=10,
                          RoleArn=batch_operations_role_arn,
                          Tags=[
                              {
                                  'Key': 'job-created-by',
                                  # Scoped to this stack so a JobCompletionFunction
                                  # in a different stack (e.g. another instance of
                                  # this solution targeting a different bucket in
                                  # the same account) never matches and processes
                                  # this job's completion event.
                                  'Value': (
                                      f'Auto Remove Event Hold Solution:'
                                      f'{stack_name}'
                                  ),
                              },
                              {'Key': 'run-id', 'Value': run_id},
                          ],
                      )
                  except Exception as exc:
                      # ParamValidationError is raised by the SDK before signing,
                      # so it means the call was rejected locally against the
                      # bundled service model and never reached S3. Separating it
                      # from every other create_job failure matters because the two
                      # need opposite responses: this one clears itself when the
                      # runtime's bundled SDK updates and needs no action, whereas
                      # a rejection returned by S3 is about the request or the
                      # account and does need one. Reached when the capability
                      # check above returned 'unknown'; the check returning
                      # 'missing' withholds before this point.
                      if isinstance(exc, ParamValidationError):
                          withheld_modes[mode] = {
                              'reason': 'event_hold_unsupported_by_runtime',
                              'botocore_version': capability[
                                  'botocore_version'
                              ],
                              'detail': str(exc)[:500],
                          }
                          print(json.dumps({
                              'event': 'createjob_event_hold_unsupported',
                              'run_id': run_id,
                              'mode': mode,
                              **withheld_modes[mode],
                          }))
                          continue
                      withheld_modes[mode] = {
                          'reason': 'create_job_failed',
                          'detail': str(exc)[:500],
                      }
                      print(json.dumps({
                          'event': 'createjob_create_job_failed',
                          'run_id': run_id,
                          'mode': mode,
                          **withheld_modes[mode],
                      }))
                      continue

                  job_id = response['JobId']
                  if confirmation_required:
                      suspended_jobs[mode] = job_id
                  else:
                      created_jobs[mode] = job_id
                      # Record this manifest as the most recently released set of
                      # versions for this mode, so the next run's eligibility query
                      # anti-joins against it (see _build_candidate_ctes). Recorded
                      # optimistically right after create_job for a non-suspended
                      # job -- BOPS is asynchronous, so this happens before the job
                      # actually runs, not after confirmed success. A row whose
                      # release fails still has hold='ON', so it remains a
                      # candidate; the anti-join only suppresses it for AT MOST one
                      # subsequent qualifying run (previous_manifest holds only the
                      # latest per-mode manifest, not an accumulating set -- see
                      # PreviousManifestTable), after which it re-qualifies.
                      # Meanwhile the BOPS completion report (always on, ReportScope
                      # AllTasks) surfaces any per-row failures for manual review.
                      s3.copy_object(
                          Bucket=solution_bucket,
                          Key=f'manifests/previous/{mode}/manifest.csv',
                          CopySource={
                              'Bucket': solution_bucket, 'Key': manifest_key,
                          },
                      )

                  print(json.dumps({
                      'event': 'createjob_job_created',
                      'run_id': run_id,
                      'mode': mode,
                      'job_id': job_id,
                      'row_count': row_count,
                      'confirmation_required': confirmation_required,
                  }))

              decision_id = context.aws_request_id
              history_key = (
                  f'manifests/combined/{run_id}/_job_summaries/'
                  f'{decision_id}.json'
              )
              human_summary = _build_human_summary(
                  run_id, trigger['dt'], target_bucket_env, report_only,
                  verified_counts, created_jobs, suspended_jobs,
                  withheld_modes, skipped_modes,
              )
              summary = {
                  # Plain-English recap, first key so it's the first thing a reader
                  # sees at the top of the SNS email body/S3 JSON file -- everything
                  # below is the same structured detail as before, unchanged.
                  'summary': human_summary,
                  'run_id': run_id,
                  'decision_id': decision_id,
                  'decision_history_key': history_key,
                  'dt': trigger['dt'],
                  'target_bucket': target_bucket_env,
                  'report_only': report_only,
                  # Recorded on every run, not only failed ones, so a successful
                  # run is evidence of what the runtime's bundled SDK supported at
                  # the time it ran.
                  'event_hold_model': capability['event_hold_model'],
                  'botocore_version': capability['botocore_version'],
                  'modes_processed': list(created_jobs) + list(suspended_jobs),
                  'eligible_counts': verified_counts,
                  'jobs_created': created_jobs,
                  'jobs_suspended': suspended_jobs,
                  'modes_withheld': withheld_modes,
                  'modes_skipped': skipped_modes,
                  'safety_threshold': safety_threshold,
                  # Informational only -- carried through from StartQuery/ManifestMaker
                  # (see README "Timestamp ties fail closed"). Never gates a job
                  # decision; query diagnostics/withheld-candidates via Athena
                  # (withheld_candidates_history table) for the full listing.
                  'withheld_candidate_count': trigger.get(
                      'withheld_candidate_count', 0),
              }
              if created_jobs:
                  # At least one ACTIVE job was created. Its real outcome is not
                  # known yet -- create_job is asynchronous, and the job can take
                  # anywhere from seconds to a long time to reach a terminal BOPS
                  # state (see JobCompletionFunction below). Sending the summary
                  # email now would describe releases that haven't happened yet,
                  # so this Lambda does NOT publish to SNS or write
                  # _job_summary.json in this case -- it defers both to
                  # JobCompletionFunction, once every active job this run created
                  # has actually finished. Write a tracking record instead, with
                  # everything JobCompletionFunction needs to pick up where this
                  # leaves off without re-deriving it from the trigger file.
                  active_jobs_record = {
                      'run_id': run_id,
                      'decision_id': decision_id,
                      'dt': trigger['dt'],
                      'target_bucket': target_bucket_env,
                      'jobs': {
                          mode: {'job_id': job_id, 'status': 'pending'}
                          for mode, job_id in created_jobs.items()
                      },
                      'verified_counts': verified_counts,
                      'suspended_jobs': suspended_jobs,
                      'withheld_modes': withheld_modes,
                      'modes_skipped': skipped_modes,
                      'safety_threshold': safety_threshold,
                      'withheld_candidate_count': trigger.get(
                          'withheld_candidate_count', 0),
                  }
                  s3.put_object(
                      Bucket=solution_bucket,
                      Key=f'manifests/combined/{run_id}/_active_jobs.json',
                      Body=json.dumps(active_jobs_record),
                      ContentType='application/json',
                  )
                  print(json.dumps({
                      'event': 'createjob_deferred_to_completion',
                      'run_id': run_id,
                      'job_ids': list(created_jobs.values()),
                  }))
                  return active_jobs_record

              # No active job was created this run (every mode was suspended,
              # withheld, or had nothing eligible) -- the outcome is already final,
              # so send the summary immediately exactly as before.
              subject = _build_subject(
                  target_bucket_env, report_only, verified_counts, suspended_jobs,
                  withheld_modes, skipped_modes,
              )
              sns.publish(
                  TopicArn=sns_topic_arn,
                  Subject=subject[:100],
                  Message=json.dumps(summary, indent=2),
              )
              summary_body = json.dumps(summary)
              s3.put_object(
                  Bucket=solution_bucket,
                  Key=history_key,
                  Body=summary_body,
                  ContentType='application/json',
              )
              s3.put_object(
                  Bucket=solution_bucket,
                  Key=f'manifests/combined/{run_id}/_job_summary.json',
                  Body=summary_body,
                  ContentType='application/json',
              )
              return summary

  CreateJobPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CreateJobFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt SolutionBucket.Arn

  # ── SNS Topic ────────────────────────────────────────────────────────────────────────
  # Receives run summaries, Safety_Threshold confirmation prompts, and failure
  # notifications from the CreateJob Lambda (Req 7.3, 8.2). No subscription is
  # provisioned here — operators subscribe after deployment. The CreateJobFunction
  # already references !Ref SNSTopic and publishes to it via sns:Publish in its
  # SNSPublish policy.

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-topic'
      DisplayName: !Sub 'Auto Remove Event Hold — ${AWS::StackName}'
      KmsMasterKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCreateJobPublish
            Effect: Allow
            Principal:
              # CreateJobRole publishes the dispatch-time email for suspended/
              # withheld/no-job runs; JobCompletionRole publishes the deferred
              # completion email once every active job a run created finishes
              # (see JobCompletionFunction) -- the two are mutually exclusive per
              # run, never both for the same run, but either can publish.
              AWS:
                - !GetAtt CreateJobRole.Arn
                - !GetAtt JobCompletionRole.Arn
            Action: sns:Publish
            Resource: !Ref SNSTopic
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              # Required, not optional. Setting any AWS::SNS::TopicPolicy replaces
              # SNS's default topic policy, so the two role ARNs above would be the
              # only principals able to publish -- CloudWatch Alarms would fail with
              # "CloudWatch Alarms is not authorized to perform: SNS:Publish" and
              # JobCompletionMissingRecordAlarm would never deliver. Scoped to this
              # stack's own alarms by aws:SourceAccount plus an aws:SourceArn ArnLike
              # on the alarm namespace, so no other account's alarm and no alarm
              # outside this Region can use the grant.
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SNSTopic
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            # sns:* is rejected by SNS with "Policy statement action out of service
            # scope" -- topic (resource-based) policies only support a fixed set of
            # resource-level actions, not account-level ones like sns:CreateTopic that
            # a full wildcard would include. Scoped to sns:Publish, the only action
            # this topic's policy actually grants (see the two Allow statements above).
            Action: 'sns:Publish'
            Resource: !Ref SNSTopic
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── BOPS service role ────────────────────────────────────────────────────────────────
  # BatchOperationsRole is the service role S3 Batch Operations assumes
  # (batchoperations.s3.amazonaws.com) to read the per-mode manifest, issue the
  # PutObjectRetention call with EventHold=OFF against each listed object version, and
  # write the completion report. BOPS owns manifest iteration, concurrency, retries,
  # and the report; no per-object Lambda sits in this path.
  #
  # IMPORTANT: s3:BypassGovernanceRetention is intentionally absent. Releasing an
  # event hold (EventHold=OFF) computes retain-until-date = MAX(existing, release time
  # + EventHoldDuration), which never shortens protection and therefore does not
  # require a governance bypass. Granting bypass would widen blast radius
  # unnecessarily and violates Req 5.3. Note this differs from the AWS-documented
  # example policy for a PutObjectRetention job, which pairs the two -- that example
  # covers shortening retention, which this solution never does.
  #
  # s3:GetBucketObjectLockConfiguration on the Target_Bucket is required by BOPS for
  # the S3PutObjectRetention operation (see "Granting permissions for Batch
  # Operations" in the Amazon S3 User Guide). It is a bucket-level read of the Object
  # Lock configuration only -- it grants no access to object data. Confirmed required,
  # not just documented: a real job created without this grant failed with
  # AccessDenied: "The object lock configuration for target bucket ... could not be
  # accessed" in internal testing.

  # SECURITY NOTE -- why this trust policy carries no Condition, and what actually
  # bounds it. This role holds the only s3:PutObjectRetention grant in the stack, so
  # any Batch Operations job that can assume it can release an event hold on any
  # object version under TargetBucket/${Prefix}, bypassing the eligibility SQL,
  # SafetyThreshold, count verification, and the run locks. Two things are worth
  # being explicit about:
  #
  # 1. aws:SourceAccount / aws:SourceArn would NOT bound this. The relevant attacker
  #    is a SAME-ACCOUNT principal holding s3:CreateJob plus iam:PassRole on this
  #    role, and such a principal satisfies both conditions -- their job's ARN is
  #    arn:...:${AWS::AccountId}:job/<their-job-id>, which any account-scoped
  #    aws:SourceArn pattern matches. A specific job ARN cannot be pinned either,
  #    since job IDs are only assigned at CreateJob time, after this role exists.
  #    These conditions defend against CROSS-account confused-deputy use, which is
  #    not the exposure here.
  # 2. AWS does not document batchoperations.s3.amazonaws.com as populating either
  #    key. The trust policy in "Granting permissions for Batch Operations" (and in
  #    the S3 Batch Operations troubleshooting guidance) has no Condition block at
  #    all, and aws:SourceArn is only present in the request context for service
  #    integrations that pass it. Services that do support it -- SSM, SageMaker --
  #    document it explicitly; S3 Batch Operations does not. Adding StringEquals on
  #    an absent context key evaluates to false and would deny sts:AssumeRole,
  #    failing every release job at run time rather than at deploy time.
  #
  # What actually bounds this: (a) the permissions policy below grants only
  # s3:PutObjectRetention plus a bucket-level Object Lock config read, scoped to
  # TargetBucket/${Prefix}, with no s3:BypassGovernanceRetention -- so the worst case
  # is an early hold release, never a deletion or a shortened retention; and (b)
  # iam:PassRole on this role must be restricted in the deploying account.
  # CreateJobRole's PassRole is already scoped to this role alone, but nothing in a
  # template can stop a different principal's identity policy from granting
  # iam:PassRole on it -- see PERMISSIONS.md, "Restricting iam:PassRole on the Batch
  # Operations role", which customers must apply on their side.
  BatchOperationsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-batchops-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batchoperations.s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReleaseEventHold
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObjectRetention
                # When Prefix is empty this resolves to arn:...:${TargetBucket}/*
                # (object wildcard). When non-empty, e.g. arn:...:${TargetBucket}/docs/*
                # Scoped to TargetBucket + prefix, matching the Athena query scope
                # (Req 8.3, 8.4, 2.1, 2.2).
                # NO s3:BypassGovernanceRetention — releasing an event hold never
                # shortens protection and requires no bypass (Req 5.3).
                # NO s3:GetObject/s3:GetObjectVersion/s3:GetObjectVersionTagging on
                # TargetBucket — the job reads object identity from the manifest in
                # SolutionBucket (see ReadManifest below), never object bytes, tags,
                # or retention metadata from TargetBucket (least-privilege; see AWS
                # Security Agent finding f-905accca on the equivalent prior role).
                Resource: !Sub
                  - 'arn:${AWS::Partition}:s3:::${TargetBucket}/${PW}*'
                  - PW: !Ref Prefix
              - Effect: Allow
                Action:
                  - s3:GetBucketObjectLockConfiguration
                # Bucket-level Object Lock configuration read, required by BOPS for
                # the S3PutObjectRetention operation. Grants no object data access.
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${TargetBucket}'
        - PolicyName: ReadManifest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*'
        - PolicyName: WriteCompletionReport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                # Completion reports are the durable per-action audit records (Req 7.1).
                # Written to SolutionBucket/reports/ — separate from Target_Bucket's
                # protected data (Req 7.2).
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/reports/*'
        - !If
          - HasKMSKey
          - PolicyName: KMSDecryptAndGenerate
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref KMSKeyArn
          - !Ref 'AWS::NoValue'

  # ── Job completion notification ──────────────────────────────────────────────────────
  # CreateJobFunction defers its SNS email for any run that created at least one
  # ACTIVE (non-suspended) job, since create_job is asynchronous and the real
  # per-object outcome isn't known at dispatch time (see CreateJobFunction's
  # createjob_deferred_to_completion branch). This section closes that loop: S3 Batch
  # Operations job status changes are recorded in CloudTrail as JobCreated/
  # JobStatusChanged events, which CloudTrail forwards to EventBridge's default event
  # bus automatically -- no CloudTrail trail needs to be created for this, it's the
  # account's always-on management-event stream. JobCompletionRule below matches
  # JobStatusChanged events whose new status is terminal (Complete/Cancelled/Failed)
  # and invokes JobCompletionFunction, which correlates the event's jobId back to a
  # run via the job's own Tags (see CreateJobFunction's create_job call), updates that
  # run's tracking record, and -- once every active job the run created has reached a
  # terminal state -- sends the single deferred completion email.

  JobCompletionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-jobcompletion-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DescribeJob
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:DescribeJob
                  # DescribeJob does not return a job's tags -- GetJobTagging is
                  # a separate API/permission, needed to correlate a job back to
                  # the run that created it (see the run-id tag CreateJobFunction
                  # sets on create_job).
                  - s3:GetJobTagging
                # Batch Operations job APIs authorize against account job ARNs --
                # same scoping as CreateJobRole's S3CreateJob statement. Read-only:
                # this role never creates, updates, or cancels a job.
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:*:${AWS::AccountId}:job/*
        - PolicyName: S3ManifestAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                # S3 only returns NoSuchKey for a missing object if the caller
                # also has s3:ListBucket on the bucket -- without it, a missing
                # _active_jobs.json surfaces as AccessDenied instead (S3 avoids
                # confirming/denying object existence to an unauthorized caller),
                # which broke the NoSuchKey handling branch below. Confirmed
                # against a real deployed stack.
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SolutionBucket}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - 'manifests/combined/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  # _active_jobs.json is read-modify-written as each job for a run
                  # completes (marking that job_id done), and _job_summary.json /
                  # _job_summaries/* are written once, when the run's last
                  # outstanding job finishes -- same final destination
                  # CreateJobFunction already writes to for the non-deferred case.
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_active_jobs.json
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_job_summary.json
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_job_summaries/*
                  # Duplicate-send lock (IfNoneMatch='*') -- claimed right before
                  # sending the one deferred completion email, guarding against
                  # multiple invocations independently observing "every job
                  # terminal" for the same run (retries, duplicate EventBridge
                  # deliveries).
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${SolutionBucket}/manifests/combined/*/_completion_sent.json
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopic
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-jobcompletion:*
        - PolicyName: DLQSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn
        - !If
          - HasKMSKey
          - PolicyName: KMSDecryptAndGenerate
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref KMSKeyArn
          - !Ref 'AWS::NoValue'

  JobCompletionFunction:
    Type: AWS::Lambda::Function
    DependsOn: JobCompletionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-jobcompletion'
      Description: >-
        Sends the single deferred SNS completion email for a run once every ACTIVE
        Batch Operations job it created has reached a terminal state (Complete/
        Cancelled/Failed). Triggered by EventBridge on S3 JobStatusChanged events.
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt JobCompletionRole.Arn
      Timeout: 60
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      Environment:
        Variables:
          SOLUTION_BUCKET: !Ref SolutionBucket
          SNS_TOPIC_ARN: !Ref SNSTopic
          STACK_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          import json
          import os
          import re
          import boto3
          from botocore.exceptions import ClientError

          _TERMINAL_STATUSES = frozenset(['Complete', 'Cancelled', 'Failed'])
          _JOB_TAG_KEY = 'job-created-by'

          # Bound on the conditional read-modify-write of _active_jobs.json below.
          # A run creates at most one job per ObjectLockMode, so at most two
          # writers ever contend for this key and one retry would do; four leaves
          # room for Lambda's own async redrives arriving in the same window
          # without ever looping for long. Exhausting it raises, which lands in
          # PipelineDLQ and is alarmed.
          _RECORD_WRITE_ATTEMPTS = 4

          # PutObject with IfMatch fails with PreconditionFailed when the ETag has
          # moved, and with ConditionalRequestConflict when another conditional
          # write to the same key is in flight. Both mean "someone else got there
          # first, re-read and re-apply", so both are retried rather than raised.
          _CONDITIONAL_WRITE_LOST = frozenset(
              ['PreconditionFailed', 'ConditionalRequestConflict']
          )

          # run_id is the S3 event sequencer StartQuery validated with the same
          # pattern before using it in a key path. Here it arrives indirectly, as a
          # BOPS job tag read back via GetJobTagging, and is used to build
          # manifests/combined/{run_id}/ keys -- so it is re-validated rather than
          # trusted as pre-validated. Tags are writable by anything holding
          # s3:PutJobTagging on a job carrying this stack's job-created-by value.
          _RUN_ID_PATTERN = re.compile(r'\A[0-9A-Fa-f]{1,64}\Z')


          def _build_completion_summary(record):
              """Plain-English recap of a completed run, mirroring
              CreateJobFunction's _build_human_summary style but reporting actual
              per-job outcomes instead of dispatch intent.
              """
              lines = [
                  f"Run {record['run_id']} against {record['target_bucket']} "
                  f"(inventory {record['dt']}) -- active mode, all jobs finished."
              ]
              for mode, job in sorted(record['jobs'].items()):
                  status = job['status']
                  succeeded = job.get('succeeded', 0)
                  failed = job.get('failed', 0)
                  total = job.get('total', succeeded + failed)
                  if status == 'Complete' and failed == 0:
                      lines.append(
                          f"{mode}: released {succeeded} of {total} event hold"
                          f"{'s' if total != 1 else ''} (job {job['job_id']})."
                      )
                  elif status == 'Complete':
                      lines.append(
                          f"{mode}: released {succeeded} of {total} event holds, "
                          f"{failed} failed -- see reports/{record['run_id']}/"
                          f"{mode}/ for details (job {job['job_id']})."
                      )
                  else:
                      reason = job.get('failure_reason', 'see job details')
                      lines.append(
                          f"{mode}: job {job['job_id']} ended {status} -- {reason}."
                      )
              for mode, job_id in sorted(record.get('suspended_jobs', {}).items()):
                  count = record.get('verified_counts', {}).get(mode, 0)
                  lines.append(
                      f"{mode}: found {count} eligible version"
                      f"{'s' if count != 1 else ''}, job {job_id} created "
                      "suspended for review (report-only) -- nothing released."
                  )
              for mode in sorted(record.get('modes_skipped', [])):
                  lines.append(f"{mode}: no eligible versions this run.")
              for mode, detail in sorted(record.get('withheld_modes', {}).items()):
                  lines.append(
                      f"{mode}: WITHHELD -- {detail.get('reason', 'unknown')}."
                  )
              return ' '.join(lines)


          # See CreateJobFunction's copy of these for why the bucket name is elided
          # rather than truncated by the caller's [:100] slice.
          _SUBJECT_MAX = 100
          _SUBJECT_STEM = 'Auto Remove Event Hold: '
          _SUBJECT_MIN_BUCKET = 20


          def _fit_subject(outcome, bucket, tag=''):
              """Assemble '{stem}{outcome}{tag} - {bucket}' inside the 100-character
              limit. The bucket name's middle is elided if the line would overflow;
              only if fewer than _SUBJECT_MIN_BUCKET characters of bucket would
              survive does the outcome drop whole trailing clauses (never half a
              printed number). Everything appears untruncated in the message body.
              """
              room = _SUBJECT_MAX - len(_SUBJECT_STEM) - len(tag) - len(' - ')
              reserved = min(len(bucket), _SUBJECT_MIN_BUCKET)
              if len(outcome) > room - reserved:
                  clauses = outcome.split(', ')
                  kept = [clauses[0]]
                  while len(kept) < len(clauses) and (
                      len(', '.join(kept + [clauses[len(kept)]])) + 3
                      <= room - reserved
                  ):
                      kept.append(clauses[len(kept)])
                  outcome = ', '.join(kept)
                  if len(kept) < len(clauses):
                      outcome += '...'
                  outcome = outcome[:room - reserved]

              head = f'{_SUBJECT_STEM}{outcome}{tag} - '
              budget = _SUBJECT_MAX - len(head)
              if len(bucket) > budget:
                  keep = max(budget - 3, 2)
                  bucket = (
                      f'{bucket[:(keep + 1) // 2]}...{bucket[-(keep // 2):]}'
                  )
              return f'{head}{bucket}'


          def _build_completion_subject(record):
              """SNS Subject line for a finished run. Version counts lead because
              that is the work actually done; job counts appear only where they carry
              information the version counts do not (a job that never completed
              released nothing and reported no per-object numbers). Bucket last,
              run_id in the body -- same reasoning as CreateJobFunction's
              _build_subject.
              """
              jobs = list(record['jobs'].values())
              complete = [j for j in jobs if j['status'] == 'Complete']
              incomplete = [
                  j for j in jobs if j['status'] in ('Cancelled', 'Failed')
              ]
              released = sum(j.get('succeeded', 0) for j in complete)
              failed = sum(j.get('failed', 0) for j in complete)
              total = released + failed

              parts = []
              if total:
                  if failed:
                      parts.append(
                          f'{released:,} of {total:,} '
                          f"version{'s' if total != 1 else ''} released, "
                          f'{failed:,} failed'
                      )
                  else:
                      parts.append(
                          f'{released:,} '
                          f"version{'s' if released != 1 else ''} released"
                      )
              if incomplete:
                  count = len(incomplete)
                  parts.append(
                      f"{count} job{'s' if count != 1 else ''} did not complete"
                  )
              outcome = ', '.join(parts) if parts else 'finished, nothing released'

              return _fit_subject(outcome, record['target_bucket'])


          def handler(event, context):
              solution_bucket = os.environ['SOLUTION_BUCKET']
              sns_topic_arn = os.environ['SNS_TOPIC_ARN']
              stack_name = os.environ['STACK_NAME']
              expected_job_tag_value = f'Auto Remove Event Hold Solution:{stack_name}'

              detail = event.get('detail', {})
              service_details = detail.get('serviceEventDetails', {})
              job_id = service_details.get('jobId')
              status = service_details.get('status')

              if not job_id or status not in _TERMINAL_STATUSES:
                  # Intermediate state (New/Preparing/Active/etc) or malformed
                  # event -- nothing to do. The EventBridge rule itself already
                  # filters to terminal statuses; this is defense in depth against
                  # a manually-sent or malformed test event.
                  print(json.dumps({
                      'event': 'jobcompletion_ignored_non_terminal',
                      'job_id': job_id, 'status': status,
                  }))
                  return {'ignored': True}

              s3control = boto3.client('s3control')
              account_id = context.invoked_function_arn.split(':')[4]

              try:
                  job = s3control.describe_job(
                      AccountId=account_id, JobId=job_id,
                  )['Job']
              except ClientError as exc:
                  print(json.dumps({
                      'event': 'jobcompletion_describe_job_failed',
                      'job_id': job_id, 'detail': str(exc)[:500],
                  }))
                  raise

              # The event's status is a filter; DescribeJob's is the fact. What
              # reaches the durable run record comes from the API, because the
              # payload is attacker-supplied on any direct invocation and this
              # record is the audit trail for removing WORM protection. The gate
              # above still uses the event so an intermediate-state event costs
              # nothing.
              #
              # A forged terminal event for a still-Active job used to be recorded
              # as terminal with that job's partial ProgressSummary, consuming the
              # run's one completion claim and understating what was released.
              # ProgressSummary and FailureReasons already came from this response,
              # so Status was the last field taken on trust.
              event_status = status
              status = job.get('Status')
              if status != event_status:
                  print(json.dumps({
                      'event': 'jobcompletion_status_disagreement',
                      'job_id': job_id,
                      'event_status': event_status,
                      'describe_job_status': status,
                  }))
              if status not in _TERMINAL_STATUSES:
                  print(json.dumps({
                      'event': 'jobcompletion_job_not_terminal',
                      'job_id': job_id, 'describe_job_status': status,
                  }))
                  return {'ignored': True, 'reason': 'job_not_terminal'}

              # DescribeJob does NOT return a job's tags (confirmed: 'Tags' is
              # absent from its response entirely) -- tags are a separate
              # GetJobTagging API. Without this, every real BOPS-dispatched job
              # completion was misclassified as jobcompletion_ignored_foreign_job
              # and silently dropped, confirmed against a real deployed stack.
              try:
                  tagging = s3control.get_job_tagging(
                      AccountId=account_id, JobId=job_id,
                  )
              except ClientError as exc:
                  print(json.dumps({
                      'event': 'jobcompletion_get_job_tagging_failed',
                      'job_id': job_id, 'detail': str(exc)[:500],
                  }))
                  raise

              tags = {t['Key']: t['Value'] for t in tagging.get('Tags', [])}
              if tags.get(_JOB_TAG_KEY) != expected_job_tag_value:
                  # Not one of this stack's jobs (or not one of this solution's
                  # jobs at all) -- the account/Region may have other, unrelated
                  # Batch Operations jobs; the EventBridge rule matches on status
                  # only, not on tags (create_job's tags aren't queryable in an
                  # EventBridge event pattern), so this Lambda is the actual
                  # filter. Ignore, not an error.
                  print(json.dumps({
                      'event': 'jobcompletion_ignored_foreign_job', 'job_id': job_id,
                  }))
                  return {'ignored': True, 'reason': 'not_this_solution'}

              run_id = tags.get('run-id')
              if not run_id:
                  print(json.dumps({
                      'event': 'jobcompletion_missing_run_id_tag', 'job_id': job_id,
                  }))
                  return {'ignored': True, 'reason': 'missing_run_id_tag'}
              if not _RUN_ID_PATTERN.match(run_id):
                  # Fail closed before any key is built from it, and ignore rather
                  # than raise: a legitimate run_id is always a hex sequencer that
                  # matches, so a value that does not is either a malformed or a
                  # tampered tag, neither of which a DLQ retry can resolve.
                  print(json.dumps({
                      'event': 'jobcompletion_invalid_run_id_tag',
                      'job_id': job_id, 'run_id': run_id[:64],
                  }))
                  return {'ignored': True, 'reason': 'invalid_run_id_tag'}

              record_key = f'manifests/combined/{run_id}/_active_jobs.json'
              s3 = boto3.client('s3')

              # _active_jobs.json holds one entry per job the run created, and
              # one invocation per job flips its own entry, so this is a
              # read-modify-write under concurrency: conditional on the ETag it
              # read, retried when it loses.
              #
              # An unconditional write is safe for repeated deliveries of the same
              # event and unsafe for two jobs' events racing, which is the normal
              # case whenever both lock modes have eligible versions. Each
              # invocation read both jobs pending, flipped its own, and the second
              # write restored the first to pending. No further event existed for
              # it, so the run never notified and never wrote a summary while both
              # jobs had already released holds.
              #
              # Retrying also puts the right invocation on the completion path:
              # the loser re-reads, sees the other job terminal, and is the one
              # that observes all-terminal against an accurate record.
              progress = job.get('ProgressSummary', {})
              reasons = job.get('FailureReasons', [])
              record = None
              still_pending = True

              for attempt in range(_RECORD_WRITE_ATTEMPTS):
                  try:
                      obj = s3.get_object(Bucket=solution_bucket, Key=record_key)
                  except ClientError as exc:
                      if exc.response['Error']['Code'] in ('NoSuchKey', '404'):
                          # Either already fully processed (record replaced by the
                          # final _job_summary.json write below) or this event
                          # somehow arrived for a run this stack never tracked --
                          # either way, nothing to do.
                          print(json.dumps({
                              'event': 'jobcompletion_no_active_jobs_record',
                              'run_id': run_id, 'job_id': job_id,
                          }))
                          return {
                              'ignored': True,
                              'reason': 'no_active_jobs_record',
                          }
                      raise
                  record = json.loads(obj['Body'].read())
                  record_etag = obj['ETag']

                  mode = None
                  for candidate_mode, job_info in record['jobs'].items():
                      if job_info['job_id'] == job_id:
                          mode = candidate_mode
                          break
                  if mode is None:
                      print(json.dumps({
                          'event': 'jobcompletion_job_not_in_record',
                          'run_id': run_id, 'job_id': job_id,
                      }))
                      return {'ignored': True, 'reason': 'job_not_in_record'}

                  if record['jobs'][mode]['status'] != 'pending':
                      # Already recorded as terminal by an earlier delivery of
                      # this same event (EventBridge/CloudTrail delivery is
                      # at-least-once, same class of duplicate-delivery problem
                      # CreateJobFunction's _createjob_lock.json already guards
                      # against). No-op. Re-checked on every attempt, because a
                      # lost conditional write can also mean a duplicate of this
                      # very event won the race.
                      print(json.dumps({
                          'event': 'jobcompletion_duplicate_event_skipped',
                          'run_id': run_id, 'job_id': job_id,
                      }))
                      return {'ignored': True, 'reason': 'duplicate_event'}

                  record['jobs'][mode].update({
                      'status': status,
                      'succeeded': progress.get('NumberOfTasksSucceeded', 0),
                      'failed': progress.get('NumberOfTasksFailed', 0),
                      'total': progress.get('TotalNumberOfTasks', 0),
                  })
                  if status != 'Complete':
                      record['jobs'][mode]['failure_reason'] = (
                          reasons[0].get('FailureReason', status)
                          if reasons else status
                      )

                  still_pending = any(
                      j['status'] == 'pending' for j in record['jobs'].values()
                  )

                  # Written on both paths, so the object always reflects what this
                  # invocation decided, including the final all-terminal state.
                  try:
                      s3.put_object(
                          Bucket=solution_bucket, Key=record_key,
                          Body=json.dumps(record),
                          ContentType='application/json',
                          IfMatch=record_etag,
                      )
                  except ClientError as exc:
                      if exc.response['Error']['Code'] in _CONDITIONAL_WRITE_LOST:
                          print(json.dumps({
                              'event': 'jobcompletion_record_write_retry',
                              'run_id': run_id, 'job_id': job_id,
                              'attempt': attempt + 1,
                          }))
                          continue
                      raise
                  break
              else:
                  # Raise rather than continue: carrying on would mean notifying
                  # from a record this invocation could not persist. This lands in
                  # PipelineDLQ, which is alarmed.
                  raise RuntimeError(
                      f"Could not update {record_key} within "
                      f"{_RECORD_WRITE_ATTEMPTS} attempts for job {job_id}"
                  )

              if still_pending:
                  # Wait for the remaining job(s) this run created; the invocation
                  # handling the last of them sends the notification.
                  print(json.dumps({
                      'event': 'jobcompletion_partial', 'run_id': run_id,
                      'job_id': job_id, 'status': status,
                  }))
                  return {'run_id': run_id, 'job_id': job_id, 'partial': True}

              # Every active job this run created is now terminal. Claim the
              # completion send via a conditional PutObject (IfNoneMatch='*'),
              # the same pattern CreateJobFunction's _createjob_lock.json already
              # uses for the identical class of problem: multiple invocations can
              # independently observe "all terminal" for the same run (Lambda's
              # own async retries after a transient failure, EventBridge/
              # CloudTrail's at-least-once delivery, or simply two different
              # jobs' JobStatusChanged events both landing after the run's last
              # job actually finishes) and would otherwise all reach this point
              # and each send a duplicate email. Confirmed against a real
              # deployed stack: an earlier AccessDenied-then-retried invocation
              # and a separate manual re-invocation both got here and both sent
              # an email before this lock was added.
              try:
                  s3.put_object(
                      Bucket=solution_bucket,
                      Key=f'manifests/combined/{run_id}/_completion_sent.json',
                      Body=json.dumps({
                          'run_id': run_id, 'request_id': context.aws_request_id,
                      }),
                      ContentType='application/json',
                      IfNoneMatch='*',
                  )
              except ClientError as exc:
                  if exc.response['Error']['Code'] == 'PreconditionFailed':
                      print(json.dumps({
                          'event': 'jobcompletion_duplicate_send_skipped',
                          'run_id': run_id,
                      }))
                      return {'run_id': run_id, 'skipped': 'duplicate_send'}
                  raise

              summary = {
                  'summary': _build_completion_summary(record),
                  'run_id': run_id,
                  'decision_id': record['decision_id'],
                  'dt': record['dt'],
                  'target_bucket': record['target_bucket'],
                  'report_only': False,
                  'jobs': record['jobs'],
                  'eligible_counts': record.get('verified_counts', {}),
                  'jobs_suspended': record.get('suspended_jobs', {}),
                  'modes_withheld': record.get('withheld_modes', {}),
                  'modes_skipped': record.get('modes_skipped', []),
                  'safety_threshold': record.get('safety_threshold'),
                  'withheld_candidate_count': record.get(
                      'withheld_candidate_count', 0),
              }
              subject = _build_completion_subject(record)
              sns = boto3.client('sns')
              sns.publish(
                  TopicArn=sns_topic_arn,
                  Subject=subject[:100],
                  Message=json.dumps(summary, indent=2),
              )
              summary_body = json.dumps(summary)
              s3.put_object(
                  Bucket=solution_bucket,
                  Key=(
                      f'manifests/combined/{run_id}/_job_summaries/'
                      f'{context.aws_request_id}.json'
                  ),
                  Body=summary_body,
                  ContentType='application/json',
              )
              s3.put_object(
                  Bucket=solution_bucket,
                  Key=f'manifests/combined/{run_id}/_job_summary.json',
                  Body=summary_body,
                  ContentType='application/json',
              )
              print(json.dumps({
                  'event': 'jobcompletion_run_complete', 'run_id': run_id,
              }))
              return summary

  JobCompletionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-jobcompletion-rule'
      Description: >-
        Matches S3 Batch Operations job status-change events (delivered via
        CloudTrail to the default EventBridge event bus -- no trail needs to be
        created for this) whose new status is terminal, and invokes
        JobCompletionFunction.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - 'AWS Service Event via CloudTrail'
        detail:
          eventSource:
            - s3.amazonaws.com
          eventName:
            - JobStatusChanged
          serviceEventDetails:
            status:
              - Complete
              - Cancelled
              - Failed
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobCompletionFunction.Arn
          Id: JobCompletionFunctionTarget

  JobCompletionRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt JobCompletionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt JobCompletionRule.Arn

  # ── SetupNotifications custom resource ───────────────────────────────────────────────
  # S3 Event Notifications on SolutionBucket cannot be configured inline because of a
  # circular dependency: the bucket must exist before Lambda permission resources can
  # reference its ARN, but the bucket's NotificationConfiguration cannot reference
  # Lambdas whose permissions have not yet been granted. This custom resource breaks
  # the cycle by calling put_bucket_notification_configuration AFTER all three Lambda
  # permission resources (StartQueryPermission, ManifestMakerPermission,
  # CreateJobPermission) have been created (Req 4.1, 4.2, 10.3).
  #
  # On Delete: clears the notification configuration so the bucket can be deleted
  # cleanly (Req 13.1).

  SetupNotificationsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-setupnotif-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3BucketNotifications
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt SolutionBucket.Arn
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-setupnotif:*

  SetupNotificationsFunction:
    Type: AWS::Lambda::Function
    DependsOn: SetupNotificationsLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-setupnotif'
      Description: >-
        CloudFormation custom resource. Sets S3 event notifications on the SolutionBucket
        after all Lambda permissions exist, avoiding the circular dependency between bucket
        and Lambda permission resources (Req 4.1, 4.2, 10.3).
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt SetupNotificationsRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          def handler(event, context):
              props = event.get('ResourceProperties', {})
              bucket = props.get('Bucket', '')
              physical_id = event.get('PhysicalResourceId', 'setup-notifications')

              try:
                  s3 = boto3.client('s3')
                  if event['RequestType'] == 'Delete':
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )
                      _cfn_send(event, context, 'SUCCESS', {}, physical_id)
                      return

                  notification_config = {
                      'LambdaFunctionConfigurations': [
                          {
                              'Id': 'InventoryManifestToStartQuery',
                              'LambdaFunctionArn': props['StartQueryArn'],
                              'Events': ['s3:ObjectCreated:*'],
                              'Filter': {
                                  'Key': {
                                      'FilterRules': [
                                          {'Name': 'prefix', 'Value': 'inventory/'},
                                          {'Name': 'suffix', 'Value': 'manifest.json'}
                                      ]
                                  }
                              }
                          },
                          {
                              'Id': 'QueryCompleteToManifestMaker',
                              'LambdaFunctionArn': props['ManifestMakerArn'],
                              'Events': ['s3:ObjectCreated:*'],
                              'Filter': {
                                  'Key': {
                                      'FilterRules': [
                                          {'Name': 'prefix', 'Value': 'manifests/parts/'},
                                          {'Name': 'suffix', 'Value': '_query_complete.json'}
                                      ]
                                  }
                              }
                          },
                          {
                              'Id': 'ManifestsReadyToCreateJob',
                              'LambdaFunctionArn': props['CreateJobArn'],
                              'Events': ['s3:ObjectCreated:*'],
                              'Filter': {
                                  'Key': {
                                      'FilterRules': [
                                          {'Name': 'prefix', 'Value': 'manifests/combined/'},
                                          {'Name': 'suffix', 'Value': '_manifests_ready.json'}
                                      ]
                                  }
                              }
                          }
                      ]
                  }
                  s3.put_bucket_notification_configuration(
                      Bucket=bucket,
                      NotificationConfiguration=notification_config
                  )
                  _cfn_send(event, context, 'SUCCESS', {}, physical_id)
              except Exception as exc:
                  _cfn_send(event, context, 'FAILED', {}, physical_id, str(exc))

          def _cfn_send(event, context, status, data, physical_id, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or 'See CloudWatch log stream: ' + context.log_stream_name,
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # Bounded: a ResponseURL that blackholes would otherwise hold the
              # invocation open for the function's whole timeout.
              urllib.request.urlopen(req, timeout=10)

  SetupNotifications:
    Type: Custom::SetupNotifications
    DependsOn:
      - StartQueryPermission
      - ManifestMakerPermission
      - CreateJobPermission
    Properties:
      ServiceToken: !GetAtt SetupNotificationsFunction.Arn
      Bucket: !Ref SolutionBucket
      StartQueryArn: !GetAtt StartQueryFunction.Arn
      ManifestMakerArn: !GetAtt ManifestMakerFunction.Arn
      CreateJobArn: !GetAtt CreateJobFunction.Arn

  # ── CloudWatch Log Groups ─────────────────────────────────────────────────────────────
  # Explicit log groups with RetentionInDays prevent indefinite log accumulation
  # (Req 7.1). Optional CMK encryption when KMSKeyArn is provided.

  LowerCaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lowercase'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  PrereqCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-prereqcheck'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  InventoryConfigLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-inventoryconfig'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  StartQueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-startquery'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  ManifestMakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-manifestmaker'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  CreateJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-createjob'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  JobCompletionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-jobcompletion'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  SetupNotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-setupnotif'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  # The ninth, and conditional like the function it serves. Without it the Lambda service
  # auto-created this group at first invocation on the account default: Never Expire and
  # no customer key, even when KMSKeyArn was set, against a KMSKeyArn description that
  # promises every function's log group. What lands here is the shared S3 Tables
  # integration ARN, the KMS key ARN, and raw AWS error text.
  S3TableIntegrationSetupLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: S3TablesIntegrationEnabled
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-s3tableintegsetup'
      RetentionInDays: 90
      KmsKeyId: !If [HasKMSKey, !Ref KMSKeyArn, !Ref 'AWS::NoValue']

  # ── CloudWatch monitoring ─────────────────────────────────────────────────────────────
  # Two alarms. One on the pipeline path where a run can complete, release event holds and
  # notify nobody; one on the dead-letter queue, where a run that failed outright lands.
  #
  # JobCompletionFunction reads manifests/combined/<run_id>/_active_jobs.json to learn
  # which jobs a run created. If that object is missing when the job status-change event
  # arrives, the handler takes its NoSuchKey branch and returns {'ignored': True,
  # 'reason': 'no_active_jobs_record'} -- the S3 Batch Operations job has already run and
  # already released holds by that point, but no SNS completion email is sent and no
  # _job_summary.json is written. The whole point of the deferred-notification design is
  # that the operator hears about every run, so this is the one gap worth an alarm.
  #
  # Reachable two ways: someone deletes the record between CreateJob writing it and
  # JobCompletion reading it (the bucket policy denies unauthorized PutObject on this
  # prefix but cannot deny DeleteObject without also blocking documented manual cleanup
  # -- see nonpublic/security-review/SECURITY-DISPOSITION.md, finding f-fb195454), or a
  # genuine bug leaves a run's record unwritten. Either way the operator needs to know.

  JobCompletionMissingRecordMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref JobCompletionLogGroup
      # Matched as a quoted string rather than as a JSON pattern ({ $.event = "..." })
      # deliberately. JobCompletionFunction emits this event with print(json.dumps(...))
      # and no LoggingConfig is set on the function, so today the log event body is bare
      # JSON and a $.event pattern would work. It would silently stop matching if the
      # function ever moved to LogFormat: JSON, which wraps the payload in a "message"
      # field. A substring match survives both formats, and the string appears nowhere
      # else in the template.
      FilterPattern: '"jobcompletion_no_active_jobs_record"'
      MetricTransformations:
        # No DefaultValue on purpose. Without one the filter publishes a data point only
        # when the pattern matches, so in a month where this never happens the metric
        # receives no data and incurs no custom-metric charge (see COST.md). Setting
        # DefaultValue: 0 would publish a zero for every non-matching log event, which
        # guarantees the charge every month and buys nothing -- the alarm's
        # TreatMissingData: notBreaching already handles the no-data case.
        - MetricNamespace: !Sub '${AWS::StackName}/EventHoldRelease'
          MetricName: JobCompletionMissingActiveJobsRecord
          MetricValue: '1'
          Unit: Count

  JobCompletionMissingRecordAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-jobcompletion-missing-record'
      AlarmDescription: >-
        A Batch Operations job completion event arrived for a run whose
        _active_jobs.json record was missing, so event holds were released without a
        completion notification and without a _job_summary.json. Check the
        jobcompletion_no_active_jobs_record entries in the JobCompletion log group for
        the affected run_id and job_id, then reconstruct what was released from the
        job's completion report under the SolutionBucket and from CloudTrail
        PutObjectRetention data events on the TargetBucket. See OPERATIONS.md,
        "Alarm: job completion with no active-jobs record".
      Namespace: !Sub '${AWS::StackName}/EventHoldRelease'
      MetricName: JobCompletionMissingActiveJobsRecord
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # notBreaching, not the default missing behaviour: the metric filter publishes
      # nothing at all in the normal case, so an alarm that treated missing data as
      # anything else would sit in INSUFFICIENT_DATA permanently and be useless.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
      # No OKActions. The metric only ever publishes a breach, so an OK transition
      # carries no information and would just add noise to the operator's inbox.

  # ── Pipeline dead-letter queue alarm ────────────────────────────────────────────────
  # The second alarm, covering a run that never finished. The alarm above covers a run
  # that finished and lost its notification.
  #
  # The four pipeline functions raise on the failures that must not look like a run with
  # nothing to do: a missing inventory column, any Athena failure or timeout, an
  # unexpected S3 error. The run stops correctly, but until this alarm existed the
  # invocation landed in the queue and nobody was told, so on the WEEKLY default a
  # pipeline that had stopped working looked like one with nothing eligible.
  #
  # Maximum, not Sum: ApproximateNumberOfMessagesVisible is a queue-depth gauge rather
  # than a counter, so summing samples reports nothing meaningful.
  #
  # Stays in ALARM until the queue is drained, which is intended: a dead-letter message
  # is evidence with a 14-day life. See OPERATIONS.md, "Alarm: a pipeline stage failed
  # and was dead-lettered".
  PipelineDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-pipeline-dlq-not-empty'
      AlarmDescription: >-
        A pipeline Lambda (StartQuery, ManifestMaker, CreateJob or JobCompletion) failed
        every retry and its invocation was dead-lettered, so this run produced no
        eligibility results and no run summary. Nothing was released. Read the message in
        the pipeline dead-letter queue for the failing function and request ID, then that
        function's CloudWatch Logs log group for the exception. The most likely causes are
        an S3 Inventory delivery whose schema no longer matches the Glue table, and an
        Athena failure or timeout. See OPERATIONS.md, "Alarm: a pipeline stage failed and
        was dead-lettered".
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PipelineDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # notBreaching for the same reason as the alarm above: SQS publishes this metric
      # only for a queue that has had traffic, so a stack whose pipeline has never failed
      # would otherwise sit in INSUFFICIENT_DATA and look broken.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
      # OKActions is set here, unlike the alarm above. That alarm's metric only ever
      # publishes a breach, so an OK transition carries no information. This one tracks a
      # real queue depth that returns to zero when an operator drains it, so the recovery
      # is a genuine event and worth confirming.
      OKActions:
        - !Ref SNSTopic

Outputs:

  LowerCaseStackName:
    Description: >-
      The CloudFormation stack name converted to lowercase. Used as a prefix when
      naming S3 buckets and other resources that require lowercase names, ensuring
      unique resource names per deployment so multiple instances can coexist in the
      same account and Region.
    Value: !GetAtt LowerCase.Lower

  SolutionBucketName:
    Description: >-
      Name of the solution-owned S3 bucket that receives S3 Inventory deliveries,
      Athena/UNLOAD output, combined manifests, and Batch Operations completion reports.
    Value: !Ref SolutionBucket

  SNSTopicArn:
    Description: ARN of the SNS topic for run summaries and notifications.
    Value: !Ref SNSTopic

  StartQueryFunctionName:
    Description: Name of the inventory-triggered eligibility Lambda function.
    Value: !Ref StartQueryFunction

  CreateJobFunctionName:
    Description: Name of the verified Batch Operations job-creation Lambda function.
    Value: !Ref CreateJobFunction

  BatchOperationsRoleName:
    Description: Name of the S3 Batch Operations service role used by release jobs.
    Value: !Ref BatchOperationsRole

  BatchOperationsRoleArn:
    Description: ARN of the S3 Batch Operations service role used by release jobs.
    Value: !GetAtt BatchOperationsRole.Arn

  ServerAccessLogsDestination:
    Condition: ServerAccessLogsEnabled
    Description: >-
      ARN of the CloudWatch Logs log group receiving the SolutionBucket's server
      access logs (either the log group created by this stack, or the existing log
      group supplied via ServerAccessLogsDestinationLogGroupArn).
    Value: !If
      - CreateServerAccessLogGroup
      - !GetAtt ServerAccessLogGroup.Arn
      - !Ref ServerAccessLogsDestinationLogGroupArn
